      additionalProperties: false
    ChapterContent:
      type: object
      description: 章节正文（v1 形状）。`format` 由服务端统一判定并下发（契约 §9.5）。
      required:
      - bookId
      - index
      - format
      - body
      - edited
      - upstreamChangedSinceBase
      - selectionSource
      - stale
      properties:
        body:
          type: string
        bookId:
          type: string
        diff:
          type: array
          items:
            $ref: '#/components/schemas/DiffOp'
          description: |-
            内联 diff（当前用户版本 vs 最新上游）：阅读器编辑视图消费；
            上游预览与无用户版本时缺省
        diffBaseVersionId:
          type:
          - string
          - 'null'
          description: 本次 diff 的基准版本（始终是最新上游）
        diffError:
          type: string
          description: diff 算不出来的原因（正文仍可用）；diff 成功或没有用户版本时缺省
        edited:
          type: boolean
          description: 当前返回的是用户版本（编辑版/导入版）
        editedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 当前用户版本的编辑时间，RFC 3339 UTC
        fetchedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次回源成功时间，RFC 3339 UTC
        format:
          type: string
          description: '`text` 或 `html`（服务端统一判定，D15）'
        index:
          type: integer
          format: int32
        lastAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次回源尝试时间（成功或失败），RFC 3339 UTC
        latestUpstreamVersionId:
          type:
          - string
          - 'null'
        latestUserVersionId:
          type:
          - string
          - 'null'
        selectionSource:
          type: string
          description: '`selected` / `edited` / `upstream` / `upstream_preview`'
        stale:
          type: boolean
          description: 到期未回源或最近一次回源失败（旧数据，仍可读）
        upstreamChangedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最新上游版本的出现时间，RFC 3339 UTC
        upstreamChangedSinceBase:
          type: boolean
          description: 用户版本的基准上游之后，上游是否又变过
        version:
          oneOf:
          - $ref: '#/components/schemas/ChapterVersionInfo'
          - type: 'null'
    ChapterImage:
      type: object
      description: |-
        章节里的一张配图。

        两种来源汇到同一个结构：书源的配图规则（独立接口）解析出来的，
        以及正文 HTML 里的 `<img>`（由前端直接渲染，不走这里）。
      properties:
        caption:
          type: string
          description: 图片下方的说明文字（番茄是「配图（画师：奈月Oo）」）。
          default: ''
        height:
          type: integer
          format: int32
          default: 0
        paraIndex:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            插入位置：正文按 `\n` 切分后的行号（从 0 开始，插在该行之前）。
            取不到位置时为 `None`，前端排在章末。
          default: null
        url:
          type: string
          default: ''
        width:
          type: integer
          format: int32
          description: 原始宽高，给图片占位用；站点没给就是 0，前端按未知处理。
          default: 0
    ChapterImages:
      type: object
      description: |-
        一章的配图列表。

        `enabled` 说明书源有没有声明配图规则，前端据此决定要不要去请求；
        「这一章没有配图」是 `enabled: true` + 空列表，不是错误。
      properties:
        enabled:
          type: boolean
          default: false
        images:
          type: array
          items:
            $ref: '#/components/schemas/ChapterImage'
          default: []

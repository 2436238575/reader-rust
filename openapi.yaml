  /v1/me/shelf/{bookId}:
    get:
      tags:
      - me
      summary: 单本书的书架条目（含缓存章数）。
      operationId: getShelfItem
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 书架条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfItem'
        '304':
          description: If-None-Match 命中，无 body
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在（未登记）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 书籍不在书架（BOOK_NOT_IN_SHELF）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    put:
      tags:
      - me
      summary: 入架（幂等）：已登记的书籍确保在架。201 首次 / 200 已在架。
      description: |-
        元数据优先用请求体里的展示字段；没带时打书籍详情（1h 缓存，详情页刚
        看过时命中）填充，本地书走本地详情。详情拿不到（源挂了/离线）不阻塞
        入架：回退登记行信息，条目先立起来。
      operationId: addToShelf
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfPutBody'
        required: true
      responses:
        '200':
          description: 已在架（幂等重复调用，不重置进度）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfWriteResult'
        '201':
          description: 已入架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfWriteResult'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 请求体含未知字段
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - me
      summary: 移出书架（幂等）：登记行、书签与正文历史保留。书籍不存在同样 204。
      operationId: removeFromShelf
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 已移出（幂等）
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    patch:
      tags:
      - me
      summary: 进度与书架状态（merge-patch，只写出现的字段）。
      description: |-
        未提供 `chapterTitle` 且章节切换时，标题从章节登记表解析；
        `lastReadAt` 服务端写——客户端时间不参与比较（契约 §5.2）。
        `group` 与 `progress` 相互独立，可只传其一。
      operationId: patchShelfBook
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfPatch'
        required: true
      responses:
        '204':
          description: 已更新
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 书籍未加入书架
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 未知字段或取值非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/shelf:batchDelete:
    post:
      tags:
      - me
      summary: |-
        批量移出（幂等）：与单个 DELETE 同语义——只摘书架行，登记行、书签与
        正文历史保留；不存在的 id 忽略。逐本调 `delete_book`（各自清缓存），
        不做整体事务：批量移出不需要「要么全删要么全留」。
      operationId: batchRemoveFromShelf

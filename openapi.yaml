        required: true
      responses:
        '204':
          description: 已保存
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 空数组 / 重复 id / 非法 id / 集合与当前书架不一致
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []

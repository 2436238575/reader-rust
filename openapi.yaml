openapi: 3.1.0
info:
  title: reader-rust v1 API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: 登录。
      description: |-
        失败统一 401 `INVALID_CREDENTIALS`（不区分账号不存在与密码错误）；
        限速命中回 429 `RATE_LIMITED` + `Retry-After`。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功，Set-Cookie 下发会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 用户名或密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求体超过 1MB 上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 不是 application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 登录失败次数过多
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: |-
        登出：吊销 refresh 会话家族并清除两枚 Cookie。幂等——Cookie 缺失或
        令牌已损坏同样返回 204。
      operationId: logout
      responses:
        '204':
          description: 已登出并清除 Cookie
  /v1/auth/password:
    post:
      tags:
      - auth
      summary: |-
        修改密码：吊销其他会话（token_version 自增），当前设备用换发的新令牌
        继续使用，避免改完密码被登出。
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: 已修改并换发当前会话
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或当前密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求体超过 1MB 上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 不是 application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 用一次性 Refresh Token 换一对新令牌（轮换 + 30 秒宽限 + 重放吊销家族）。
      description: |-
        只认 `reader_refresh` Cookie。失败按原因细分并清除两枚 Cookie：
        `AUTH_EXPIRED`（无效/过期，静默失败）与 `AUTH_REFRESH_REPLAYED`
        （重放检测，会话已吊销，必须重新登录）。
      operationId: refreshToken
      responses:
        '200':
          description: 换发成功，Set-Cookie 下发新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '401':
          description: 令牌无效/过期或重放检测命中，附清除 Cookie
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/books/{bookId}:
    get:
      tags:
      - books
      summary: 书籍详情：详情规则求值（1h 缓存）+ 章节登记表的统计切片。
      operationId: getBook
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 书籍详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    patch:
      tags:
      - books
      summary: 改书名/作者（登记表列；merge-patch，只写出现的字段）。
      description: |-
        intro/kind/wordCount/cover 的存储还在 `shelf_books`（元数据迁移未做），
        本端点暂不收——传入即 422 `UNKNOWN_FIELD`。
      operationId: patchBook
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
        required: true
      responses:
        '204':
          description: 已更新
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 未知字段（本端点只收 name/author）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters:
    get:
      tags:
      - books
      summary: 章节列表。
      description: |-
        `refresh=true` 是用户显式刷新：上游失败直接 502，不回退旧登记表
        （静默成功会掩盖书源已失效）；普通读才用旧目录兜底并标 `stale`。
      operationId: listChapters
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: refresh
        in: query
        description: 同步重抓目录（只对第一页生效）
        required: false
        schema:
          type: boolean
      - name: tocVersion
        in: query
        description: 第一页的 tocVersion，续页回传用于检测目录快照已刷新
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 章节页（按 index 升序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterPage'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: limit 超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 目录已刷新（tocVersion 不匹配），客户端从第一页重拉
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 上游失败；refresh=true 时不回退旧目录，如实报错
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/{index}/content:
    get:
      tags:
      - books
      summary: 章节正文。
      operationId: getChapterContent
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号（登记表分配的稳定序号）
        required: true
        schema:
          type: integer
          format: int32
      - name: variant
        in: query
        description: default（用户选择）或 upstream（上游预览）
        required: false
        schema:
          type: string
      - name: refresh
        in: query
        description: 同步回源一次，失败回退已有缓存
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 章节正文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContent'
        '304':
          description: If-None-Match 命中当前版本，客户端用缓存正文
        '400':
          description: variant 取值非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍或章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters:batchContent:
    post:
      tags:
      - books
      summary: |-
        一次 1..=10 章，服务端并发 4，逐项成败：整体恒 200，每章 `data`/`error`
        二选一（契约 §8.4）。`?refresh=true` 同步回源后逐项读取。
      operationId: batchChapterContent
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchContentRequest'
        required: true
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchContentResponse'
        '400':
          description: indices 为空/超上限/重复/含负数
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me:
    get:
      tags:
      - me
      summary: 当前账号资料。
      description: 时间字段统一由服务端下发，客户端时钟不参与任何比较（契约 §5.2）。
      operationId: getMe
      responses:
        '200':
          description: 当前账号资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或令牌失效，客户端应静默刷新或重新登录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 服务端错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/replace-rules:
    get:
      tags:
      - me
      summary: 替换规则列表（按 `order` 升序）。
      operationId: listReplaceRules
      responses:
        '200':
          description: 替换规则列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReplaceRuleItem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - me
      summary: 新建或整体替换（按 name upsert）：201 新建 / 200 替换。
      operationId: createReplaceRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRuleWrite'
        required: true
      responses:
        '200':
          description: 同名规则已存在，整体替换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRuleItem'
        '201':
          description: 已新建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRuleItem'
        '422':
          description: 规则名或匹配串为空
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/replace-rules/{name}:
    delete:
      tags:
      - me
      summary: 删除（幂等）：不存在也 204。
      operationId: deleteReplaceRule
      parameters:
      - name: name
        in: path
        description: 规则名（身份）
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 已删除（幂等）
      security:
      - cookieAuth: []
      - bearerAuth: []
    patch:
      tags:
      - me
      summary: 部分更新（merge-patch）：404 规则不存在。
      operationId: patchReplaceRule
      parameters:
      - name: name
        in: path
        description: 规则名（身份）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRulePatch'
        required: true
      responses:
        '200':
          description: 更新后的规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRuleItem'
        '404':
          description: 规则不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/replace-rules:batch:
    post:
      tags:
      - me
      summary: 批量 upsert（导入/跨端同步）：返回写入条数。
      operationId: batchUpsertReplaceRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpsertRequest'
        required: true
      responses:
        '200':
          description: 写入条数
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/replace-rules:batchDelete:
    post:
      tags:
      - me
      summary: 批量删除：返回删除条数（不存在的名字忽略）。
      operationId: batchDeleteReplaceRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
        required: true
      responses:
        '200':
          description: 删除条数
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/shelf:
    get:
      tags:
      - me
      summary: 我的书架（按 position 升序，游标分页）。
      operationId: listShelf
      parameters:
      - name: cursor
        in: query
        description: 上一页的 nextCursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: 书架页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfPage'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: limit 超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/shelf/{bookId}:
    get:
      tags:
      - me
      summary: 单本书的书架条目（含缓存章数）。
      operationId: getShelfItem
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 书架条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfItem'
        '304':
          description: If-None-Match 命中，无 body
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在（未登记）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 书籍不在书架（BOOK_NOT_IN_SHELF）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    put:
      tags:
      - me
      summary: 入架（幂等）：已登记的书籍确保在架。201 首次 / 200 已在架。
      description: |-
        元数据优先用请求体里的展示字段；没带时打书籍详情（1h 缓存，详情页刚
        看过时命中）填充，本地书走本地详情。详情拿不到（源挂了/离线）不阻塞
        入架：回退登记行信息，条目先立起来。
      operationId: addToShelf
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfPutBody'
        required: true
      responses:
        '200':
          description: 已在架（幂等重复调用，不重置进度）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfWriteResult'
        '201':
          description: 已入架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfWriteResult'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 请求体含未知字段
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - me
      summary: 移出书架（幂等）：登记行、书签与正文历史保留。书籍不存在同样 204。
      operationId: removeFromShelf
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 已移出（幂等）
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    patch:
      tags:
      - me
      summary: 进度与书架状态（merge-patch，只写出现的字段）。
      description: |-
        未提供 `chapterTitle` 且章节切换时，标题从章节登记表解析；
        `lastReadAt` 服务端写——客户端时间不参与比较（契约 §5.2）。
      operationId: patchShelfBook
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfPatch'
        required: true
      responses:
        '204':
          description: 已更新
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 书籍未加入书架
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 未知字段或取值非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/shelf:batchDelete:
    post:
      tags:
      - me
      summary: |-
        批量移出（幂等）：与单个 DELETE 同语义——只摘书架行，登记行、书签与
        正文历史保留；不存在的 id 忽略。逐本调 `delete_book`（各自清缓存），
        不做整体事务：批量移出不需要「要么全删要么全留」。
      operationId: batchRemoveFromShelf
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfBatchDeleteRequest'
        required: true
      responses:
        '200':
          description: 删除条数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfBatchDeleteResult'
        '400':
          description: book_ids 为空或超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:
    get:
      tags:
      - sources
      summary: 书源列表。
      description: 书源摘要页。排序固定为 id 升序（创建顺序）；游标 keyset 依赖不可变排序键。
      operationId: listSources
      parameters:
      - name: q
        in: query
        description: 名称或 URL 的大小写不敏感子串
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: 书源摘要页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: limit 超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
components:
  schemas:
    BatchContentError:
      type: object
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type:
          - string
          - 'null'
    BatchContentItem:
      type: object
      required:
      - index
      properties:
        data:
          $ref: '#/components/schemas/ChapterContent'
        error:
          $ref: '#/components/schemas/BatchContentError'
        index:
          type: integer
          format: int32
    BatchContentRequest:
      type: object
      required:
      - indices
      properties:
        indices:
          type: array
          items:
            type: integer
            format: int32
      additionalProperties: false
    BatchContentResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchContentItem'
    BatchDeleteRequest:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            type: string
      additionalProperties: false
    BatchUpsertRequest:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ReplaceRuleWrite'
      additionalProperties: false
    BookDetail:
      type: object
      required:
      - id
      - name
      - bookUrl
      - stale
      properties:
        author:
          type:
          - string
          - 'null'
        bookUrl:
          type: string
          description: 上游地址：只读诊断字段（红线 6 例外之外的只读输出）
        coverImageId:
          type:
          - string
          - 'null'
          description: |-
            封面在图片管道中的 id（md5(去查询串地址)）；取图地址随 images 域
            切换迁移（当前 /reader3/image/<id>）
        id:
          type: string
          description: 不透明 id（`book_<n>`）
        intro:
          type:
          - string
          - 'null'
        kind:
          type:
          - string
          - 'null'
        lastChapter:
          oneOf:
          - $ref: '#/components/schemas/LastChapter'
          - type: 'null'
        name:
          type: string
        sourceId:
          type:
          - string
          - 'null'
          description: 绑定书源；null 表示本地书
        stale:
          type: boolean
          description: 上游详情获取失败，当前是登记行回退数据
        totalChapters:
          type:
          - integer
          - 'null'
          format: int32
          description: 章节登记表的章节数（目录未抓时缺省）
          minimum: 0
    BookPatch:
      type: object
      properties:
        author:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type:
          - string
          - 'null'
        newPassword:
          type:
          - string
          - 'null'
    ChapterContent:
      type: object
      description: 章节正文（v1 形状）。`format` 由服务端统一判定并下发（契约 §9.5）。
      required:
      - bookId
      - index
      - format
      - body
      - edited
      - upstreamChangedSinceBase
      - selectionSource
      - stale
      properties:
        body:
          type: string
        bookId:
          type: string
        diff:
          type: array
          items:
            $ref: '#/components/schemas/DiffOp'
          description: |-
            内联 diff（当前用户版本 vs 最新上游）：阅读器编辑视图消费；
            上游预览与无用户版本时缺省
        diffBaseVersionId:
          type:
          - string
          - 'null'
          description: 本次 diff 的基准版本（始终是最新上游）
        diffError:
          type: string
          description: diff 算不出来的原因（正文仍可用）；diff 成功或没有用户版本时缺省
        edited:
          type: boolean
          description: 当前返回的是用户版本（编辑版/导入版）
        editedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 当前用户版本的编辑时间，RFC 3339 UTC
        fetchedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次回源成功时间，RFC 3339 UTC
        format:
          type: string
          description: '`text` 或 `html`（服务端统一判定，D15）'
        index:
          type: integer
          format: int32
        lastAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次回源尝试时间（成功或失败），RFC 3339 UTC
        latestUpstreamVersionId:
          type:
          - string
          - 'null'
        latestUserVersionId:
          type:
          - string
          - 'null'
        selectionSource:
          type: string
          description: '`selected` / `edited` / `upstream` / `upstream_preview`'
        stale:
          type: boolean
          description: 到期未回源或最近一次回源失败（旧数据，仍可读）
        upstreamChangedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最新上游版本的出现时间，RFC 3339 UTC
        upstreamChangedSinceBase:
          type: boolean
          description: 用户版本的基准上游之后，上游是否又变过
        version:
          oneOf:
          - $ref: '#/components/schemas/ChapterVersionInfo'
          - type: 'null'
    ChapterItem:
      type: object
      description: 章节条目：身份是 `index`（书籍内稳定序号，换源整表替换）。
      required:
      - index
      - title
      - url
      - titleOverridden
      - isVip
      - isPay
      - isVolume
      properties:
        index:
          type: integer
          format: int32
        isPay:
          type: boolean
        isVip:
          type: boolean
        isVolume:
          type: boolean
        title:
          type: string
        titleOverridden:
          type: boolean
          description: 用户改名覆盖生效中（改名走 `chapter_title_overrides`，不写回上游标题）
        url:
          type: string
          description: |-
            只读诊断字段（红线 6 例外：仅出现在响应里）。过渡期阅读器仍靠它
            调 /reader3 的评论/配图/编辑接口与 IndexedDB 缓存键；这些域迁走后删除
        volume:
          type:
          - string
          - 'null'
        wordCount:
          type:
          - string
          - 'null'
    ChapterPage:
      type: object
      description: '游标分页容器（契约 §5.4）：`nextCursor: null` 表示到底。'
      required:
      - items
      - stale
      - complete
      properties:
        complete:
          type: boolean
          description: |-
            目录是否抓全：false 表示只登记了部分章节（后台补全中/被截断），
            客户端可稍后重取，不要把当前 `total` 当全书章节数
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChapterItem'
        nextCursor:
          type:
          - string
          - 'null'
        stale:
          type: boolean
          description: |-
            登记表已过 TTL：本次先返回旧目录，后台正在刷新；上游失败时也会
            保持 true 继续服务旧数据（不再把「目录打不开」当过期代价）
        tocVersion:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            目录快照令牌（`book_toc_state.fetched_at`）：续页回传用于发现
            「翻页途中后台刷新整表替换」；本地书没有登记表，恒为 null
        total:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ChapterVersionInfo:
      type: object
      description: 当前解析版本的信息。`basedOn` 只记录编辑时基于哪一版（历史信息）。
      required:
      - id
      - kind
      properties:
        basedOn:
          type:
          - string
          - 'null'
        id:
          type: string
          description: 不透明版本 id（`cv_<n>`），同时是 If-None-Match 的实体标签
        kind:
          type: string
          description: '`upstream` / `edited` / `imported`'
    DiffOp:
      type: object
      required:
      - type
      properties:
        baseIndex:
          type:
          - integer
          - 'null'
          minimum: 0
        baseText:
          type:
          - string
          - 'null'
        editedIndex:
          type:
          - integer
          - 'null'
          minimum: 0
        editedText:
          type:
          - string
          - 'null'
        type:
          type: string
    ErrorCode:
      type: string
      description: |-
        错误码：线上值是大写下划线（serde `SCREAMING_SNAKE_CASE`），稳定不变。
        新增取值是兼容变更（客户端必须有 default 分支），改已有取值的语义是破坏变更。
      enum:
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - INVALID_CURSOR
      - STALE_CURSOR
      - INVALID_CREDENTIALS
      - AUTH_EXPIRED
      - AUTH_REFRESH_REPLAYED
      - SESSION_INVALID
      - CSRF_HEADER_MISSING
      - SCOPE_FORBIDDEN
      - BOOK_NOT_FOUND
      - CHAPTER_NOT_FOUND
      - SOURCE_NOT_FOUND
      - IMAGE_NOT_FOUND
      - TASK_NOT_FOUND
      - NOT_FOUND
      - REPLACE_RULE_NOT_FOUND
      - BOOK_NOT_IN_SHELF
      - SOURCE_DISABLED
      - TASK_ALREADY_RUNNING
      - CONFLICT
      - VERSION_CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - RATE_LIMITED
      - UPSTREAM_BLOCKED
      - UPSTREAM_FAILED
      - UPSTREAM_TIMEOUT
      - PROCESSING_TIMEOUT
      - TASK_LIMIT
      - API_REMOVED
      - UNKNOWN_FIELD
      - INTERNAL
    FieldIssue:
      type: object
      description: 422 校验失败的逐字段错误：`pointer` 是 JSON Pointer，前端直接映射表单控件。
      required:
      - pointer
      - code
      properties:
        code:
          type: string
        detail:
          type: string
        pointer:
          type: string
    LastChapter:
      type: object
      required:
      - index
      - title
      properties:
        index:
          type: integer
          format: int32
        title:
          type: string
    LoginRequest:
      type: object
      properties:
        password:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
    Me:
      type: object
      description: |-
        当前账号资料。`id` 是不透明字符串（`u_<uid>`），客户端不解析。
        `createdAt` 一律 RFC 3339 UTC（契约红线 7）。
      required:
      - id
      - username
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: 注册时间，RFC 3339 UTC
        id:
          type: string
        username:
          type: string
    Problem:
      type: object
      description: |-
        problem+json 响应体。`type` 固定 `about:blank`（RFC 9457 缺省类型，
        语义由 `code` 承载，不要求维护错误文档页）。
      required:
      - type
      - code
      - status
      - title
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        instance:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
        upstreamCode:
          type: string
          description: 上游业务码原样透传（FQWeb 的 `UPSTREAM_THROTTLED` 等）
    ProgressPatch:
      type: object
      required:
      - chapterIndex
      properties:
        chapterIndex:
          type: integer
          format: int32
        chapterTitle:
          type:
          - string
          - 'null'
        offset:
          type:
          - number
          - 'null'
          format: double
          description: 0..1 的章内比例（服务端存万分比）
      additionalProperties: false
    ReplaceRuleItem:
      type: object
      description: 替换规则条目。`name` 是身份（书名内唯一）。
      required:
      - name
      - pattern
      - replacement
      - isEnabled
      - isRegex
      - order
      properties:
        group:
          type:
          - string
          - 'null'
        isEnabled:
          type: boolean
        isRegex:
          type: boolean
        name:
          type: string
        order:
          type: integer
          format: int32
        pattern:
          type: string
          description: 匹配串；`isRegex` 为 true 时按正则解释
        replacement:
          type: string
        scope:
          type:
          - string
          - 'null'
          description: '`book:<bookId>` / `source:<bookSourceId>`；null 表示全局'
    ReplaceRulePatch:
      type: object
      description: |-
        merge-patch 请求：只写出现的字段；可空字段用「双重 Option」表达
        「缺省 = 不改 / null = 清空」（`scope` 改回全局就靠这个）。
      properties:
        group:
          type:
          - string
          - 'null'
        isEnabled:
          type:
          - boolean
          - 'null'
        isRegex:
          type:
          - boolean
          - 'null'
        order:
          type:
          - integer
          - 'null'
          format: int32
        pattern:
          type:
          - string
          - 'null'
          description: |-
            必填字段：`null` 与空串同语义（422），清空没有意义；双重 Option
            只为与同结构其他可空字段保持一致的类型形态
        replacement:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
      additionalProperties: false
    ReplaceRuleWrite:
      type: object
      required:
      - name
      - pattern
      properties:
        group:
          type:
          - string
          - 'null'
        isEnabled:
          type:
          - boolean
          - 'null'
        isRegex:
          type:
          - boolean
          - 'null'
        name:
          type: string
        order:
          type:
          - integer
          - 'null'
          format: int32
        pattern:
          type: string
        replacement:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
      additionalProperties: false
    SessionTokens:
      type: object
      description: |-
        会话令牌对。`accessToken` 供非浏览器客户端走 `Authorization: Bearer`；
        浏览器只依赖 HttpOnly Cookie，`refreshToken` 永不进响应体。
      required:
      - accessToken
      - accessTokenExpiresAt
      - username
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: access token 的过期时间，RFC 3339 UTC
        username:
          type: string
          description: 登录用户名（hint 展示与 API 客户端识别；/v1/me 才是资料源）
    ShelfBatchDeleteRequest:
      type: object
      required:
      - bookIds
      properties:
        bookIds:
          type: array
          items:
            type: string
      additionalProperties: false
    ShelfBatchDeleteResult:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: integer
          format: int32
          minimum: 0
    ShelfItem:
      type: object
      description: 书架条目：书的注册信息快照 + 我的进度/分组。
      required:
      - bookId
      - name
      - author
      - bookUrl
      - origin
      - group
      - progress
      - cachedChapters
      - position
      properties:
        author:
          type: string
        bookId:
          type: string
        bookUrl:
          type: string
          description: 上游地址：只读诊断字段（红线 6 例外）
        cachedChapters:
          type: integer
          format: int32
          description: 已缓存正文的章节数（本地书恒 0）
          minimum: 0
        canUpdate:
          type:
          - boolean
          - 'null'
        charset:
          type:
          - string
          - 'null'
        coverImageId:
          type:
          - string
          - 'null'
          description: 封面在图片管道中的 id；客户端取图走 `/reader3/image/<id>`
        customCoverUrl:
          type:
          - string
          - 'null'
          description: 用户自设封面（任意地址，原样透传）
        group:
          type: integer
          format: int64
          description: 分组位掩码（与阅读3.0 约定一致，前端按位与过滤）
        intro:
          type:
          - string
          - 'null'
        kind:
          type:
          - string
          - 'null'
        lastCheckAt:
          type:
          - string
          - 'null'
          format: date-time
        lastReadAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近阅读时间，RFC 3339 UTC；未读过为 null
        latestChapterTitle:
          type:
          - string
          - 'null'
        name:
          type: string
        origin:
          type: string
        originName:
          type:
          - string
          - 'null'
        position:
          type: integer
          format: int64
          description: 书架排序位置（升序）
        progress:
          $ref: '#/components/schemas/ShelfProgress'
        sourceId:
          type:
          - string
          - 'null'
          description: 绑定书源（`src_<n>`）；null 表示本地书
        totalChapters:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        wordCount:
          type:
          - string
          - 'null'
    ShelfPage:
      type: object
      description: 书架页（按 position 升序）。
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShelfItem'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          format: int32
          minimum: 0
    ShelfPatch:
      type: object
      properties:
        progress:
          oneOf:
          - $ref: '#/components/schemas/ProgressPatch'
          - type: 'null'
      additionalProperties: false
    ShelfProgress:
      type: object
      required:
      - chapterIndex
      - offset
      properties:
        chapterIndex:
          type: integer
          format: int32
        chapterTitle:
          type:
          - string
          - 'null'
        offset:
          type: number
          format: double
          description: 章内进度 0..1（存储是万分比）
    ShelfPutBody:
      type: object
      description: |-
        入架请求体：全部字段可选（`{}` 表示全部缺省），**但请求体本身必填**——
        无 body / 无 `Content-Type` 会 415/400，无字段的调用方也至少传 `{}`。
        调用方（搜索/发现结果）已有展示字段时带上，服务端跳过回源详情——
        发现页直接入架、源已挂时，不让「加入书架」干等最坏 3×10s 的详情重试。
      properties:
        author:
          type:
          - string
          - 'null'
          default: null
        coverUrl:
          type:
          - string
          - 'null'
          description: 封面：本站取图地址（`/reader3/image/<id>`）会还原成上游地址落库
          default: null
        intro:
          type:
          - string
          - 'null'
          default: null
        kind:
          type:
          - string
          - 'null'
          default: null
        name:
          type:
          - string
          - 'null'
          default: null
      additionalProperties: false
    ShelfWriteResult:
      type: object
      required:
      - bookId
      properties:
        bookId:
          type: string
    SourcePage:
      type: object
      description: '游标分页容器（契约 §5.4）：`nextCursor: null` 表示到底。'
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceSummary'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type:
          - integer
          - 'null'
          format: int32
          description: 过滤后的总数（小表直接算，不做惰性统计）
          minimum: 0
    SourceSummary:
      type: object
      description: 书源摘要：展示字段 + `exploreUrl`，不含规则 JSON。
      required:
      - id
      - name
      - url
      - enabled
      - enabledExplore
      - enabledCookieJar
      properties:
        customOrder:
          type:
          - integer
          - 'null'
          format: int32
        enabled:
          type: boolean
        enabledCookieJar:
          type: boolean
        enabledExplore:
          type: boolean
        exploreUrl:
          type:
          - string
          - 'null'
        group:
          type:
          - string
          - 'null'
        id:
          type: string
          description: 不透明 id（`src_<n>`），客户端不解析

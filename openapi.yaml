        响应是不带包装的 Book（`bookId` 已分配，且已在书架）。
      operationId: uploadLocalBook
      parameters:
      - name: kind
        in: query
        description: 显式声明格式（txt / epub）；缺省按扩展名分派
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 已创建并入架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: file 缺失 / 解析失败 / 超出本地书数量上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: TXT 上限 50MB、EPUB 上限 80MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me:
    get:
      tags:
      - me
      summary: 当前账号资料。
      description: 时间字段统一由服务端下发，客户端时钟不参与任何比较（契约 §5.2）。
      operationId: getMe
      responses:
        '200':
          description: 当前账号资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或令牌失效，客户端应静默刷新或重新登录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 服务端错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/backups:
    post:
      tags:
      - files
      summary: |-
        生成服务端备份：快照当前账号的书架/分组/书源/书签/替换规则，原子写入
        `/backups/reader-backup-<UTC 时间>-<随机后缀>.json`。
      operationId: createBackup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupCreateRequest'
        required: true
      responses:
        '201':
          description: 已写入的备份文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebdavEntry'
        '400':
          description: 请求体含未知字段
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/backups:inspect:
    post:
      tags:
      - files
      summary: |-
        恢复前预览备份内容（不写库）：确认框展示各域条数，空书源等异常在
        用户点「确定」之前可见。
      operationId: inspectBackup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequest'
        required: true
      responses:
        '200':
          description: 备份摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupInspectResult'
        '400':
          description: 路径为空/非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 备份文件不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 备份文件超过 100MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 备份 JSON 非法、必填字段缺失或类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/backups:restore:
    post:
      tags:
      - files
      summary: |-
        以备份为准恢复：删除当前书架/分组/书源/书签/替换规则后按文档重建。
        返回各域条数与备份里的 localStorage 快照（前端只应用已知键）。
      operationId: restoreBackup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequest'
        required: true
      responses:
        '200':
          description: 恢复结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebdavRestoreResult'
        '400':
          description: 路径为空/非法、备份版本不支持或书籍缺少 bookUrl
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 备份文件不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 已有恢复任务正在执行
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 备份文件超过 100MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 备份 JSON 非法、必填字段缺失或类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/files:
    get:
      tags:
      - files
      summary: |-
        目录列表（`?path=`，缺省根目录）。强 ETag 对响应字节取 md5，命中
        `If-None-Match` 回 304。
      operationId: listFiles
      parameters:
      - name: path
        in: query
        description: 目录路径，缺省 /
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 目录条目（隐藏文件不列出）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebdavEntry'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: 路径非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 目录不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - files
      summary: |-
        multipart 上传：`?path=` 是目标目录，`file` 字段可重复（最多 20 个字段）。
        目标目录不存在时自动创建（与 `/reader3/uploadFileToWebdav` 一致）。
      operationId: uploadFiles
      parameters:
      - name: path
        in: query
        description: 目标目录，缺省 /
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebdavUploadForm'
        required: true
      responses:
        '201':
          description: 已写入条目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebdavEntry'
        '400':
          description: 缺少文件字段、文件名非法或超过单文件 100MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/files/{path}:
    get:
      tags:
      - files
      summary: |-
        下载文件（流式，不整读进内存）。显式 Content-Type 与 `sandbox` CSP
        （路由层补）避免备份 JSON/HTML 被浏览器当页面执行。
      operationId: downloadFile
      parameters:
      - name: path
        in: path
        description: 相对用户根目录的文件路径（可含 /）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 文件内容（流式）
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: 路径非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 文件不存在或是目录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - files
      summary: 递归删除文件或目录；不存在的路径按 404（幂等重试由客户端决定）。
      operationId: deleteFile
      parameters:
      - name: path
        in: path
        description: 相对用户根目录的路径（可含 /）
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 已删除
        '400':
          description: 路径为空或非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 路径不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/files:batchDelete:
    post:

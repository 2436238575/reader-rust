      - sources
      summary: 删除失效书源：分组含「失效」标记的整行删除（与 `/reader3` 同口径）。
      operationId: deleteInvalidSources
      responses:
        '200':
          description: 删除条数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteSourcesResult'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:export:
    get:
      tags:
      - sources
      summary: '全量导出书源材料（含全部规则字段），带 `Content-Disposition: attachment`。'
      operationId: exportSources
      responses:
        '200':
          description: 全量书源 JSON 数组（attachment）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSource'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:fetch:
    post:
      tags:
      - sources
      summary: 从远端 URL 拉取书源 JSON 并解析（严格公网 SSRF 策略）。
      operationId: fetchSourceFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchSourcesRequest'
        required: true
      responses:
        '200':
          description: 解析出的书源（未落库）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSource'
        '400':
          description: URL 非法或指向私网/环回/保留地址
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 远端响应超过 32MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: JSON 或源材料非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 远端请求失败或返回非 2xx
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:import:
    post:
      tags:
      - sources
      summary: '导入书源（JSON `{sources: []}` 或 multipart JSON 文件）→ 202 Task。'
      operationId: importSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceImportRequest'
        required: true
      responses:
        '202':
          description: 任务已入队
          headers:
            Location:
              schema:
                type: string
              description: 任务资源地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: 请求体不是合法的书源 JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 必须是 application/json 或 multipart/form-data
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: sources 为空或超过上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 并发任务超限，带 Retry-After
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:parse:
    post:
      tags:
      - sources
      summary: 解析上传的书源文件：只解析、不落库，返回 `Vec<BookSource>` 供预览。
      operationId: parseSourceFile
      requestBody:
        description: file 字段：.json / .txt（≤32MB）
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: 解析出的书源（未落库）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSource'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 文件超过 32MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 缺少文件 / 扩展名不支持 / JSON 或源材料非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:test:
    post:
      tags:
      - sources
      summary: 批量测试书源 → 202 Task。
      operationId: testSources
      parameters:
      - name: markInvalid
        in: query
        description: 是否把无效源写入「失效」分组；默认 false（测试是读操作）
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTestRequest'
        required: true
      responses:
        '202':
          description: 任务已入队
          headers:
            Location:
              schema:
                type: string
              description: 任务资源地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '404':
          description: ids 中的书源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ids 超过上限或没有可测试的书源
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 并发任务超限，带 Retry-After
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sse-tickets:
    post:
      tags:
      - tasks
      summary: 签发一次性 SSE 票据（60 秒有效、绑定单个事件流路径）。
      operationId: createSseTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SseTicketRequest'
        required: true
      responses:
        '201':
          description: '已签发（响应 `Cache-Control: no-store`）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SseTicketResponse'
        '422':
          description: path 缺失或不是事件流路径
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 未消费票据过多，带 Retry-After
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/tasks:
    get:
      tags:
      - tasks
      summary: 我的任务列表（最新在前）。刷新页面后据此恢复还在跑的任务。
      operationId: listTasks
      parameters:
      - name: state
        in: query
        description: 按状态过滤：queued/running/cancelling/succeeded/failed/cancelled
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor；空表示第一页
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          description: limit 越界或未知 state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/tasks/{taskId}:
    get:
      tags:
      - tasks
      summary: 任务状态（事件流断开后先用它拿全量状态，再用 Last-Event-ID 补增量）。
      operationId: getTask
      parameters:
      - name: taskId
        in: path
        description: 任务 id（tsk_<n>）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '304':
          description: If-None-Match 命中，任务状态未变
        '404':
          description: 任务不存在或已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - tasks
      summary: |-
        请求取消（204；已结束的任务同样 204）。取消是「请求」：状态先变
        `cancelling`，工作器察觉后落到 `cancelled`。5 秒 watchdog 兜底：
        工作器卡死/异常退出时强制落终态，不让名额被永久占用。
      operationId: cancelTask
      parameters:
      - name: taskId
        in: path
        description: 任务 id（tsk_<n>）
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 已请求取消（幂等）
        '404':
          description: 任务不存在或已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/tasks/{taskId}/events:
    get:
      tags:
      - tasks
      summary: 任务事件流（text/event-stream）。
      description: |-
        事件名固定四种：`progress` / `item` / `error` / `done`，每条都有 `id:`；
        断线重连时带 `Last-Event-ID` 从缓冲重放。非浏览器客户端可先
        `POST /v1/sse-tickets` 再以 `?ticket=` 连接（60 秒、一次性、绑定本路径）。
      operationId: taskEvents
      parameters:
      - name: taskId
        in: path
        description: 任务 id（tsk_<n>）
        required: true
        schema:
          type: string
      - name: ticket
        in: query
        description: SSE 票据（非浏览器客户端/离线导出；60 秒一次性）
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSE 事件流（text/event-stream）。`progress` 数据体为 TaskProgress，`item` 为 TaskItemEvent，`error` 为 Problem，`done` 为 TaskDoneEvent。
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: 票无效/过期，或未登录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 任务不存在或已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 同一任务的事件流订阅者过多
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/tasks/{taskId}/result:
    get:
      tags:
      - tasks
      summary: 任务结果（按 kind 解释；search 去重后分页，prefetch-cache 返回摘要）。
      operationId: getTaskResult
      parameters:
      - name: taskId
        in: path
        description: 任务 id（tsk_<n>）
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor；空表示第一页
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: 任务结果（search：TaskResultPage；prefetch-cache：PrefetchSummary）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultResponse'
        '304':
          description: If-None-Match 命中，结果页未变
        '400':
          description: limit 越界
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 任务不存在或已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 结果游标无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
components:
  schemas:
    BackupCreateRequest:
      type: object
      description: |-
        创建备份的可选本地配置快照。服务端不知道浏览器 localStorage，必须由
        前端把白名单键放进来；空对象表示「这些键当前都没有值」。
      properties:
        localState:
          type:
          - object
          - 'null'
          description: 缺省 = 这份备份不含浏览器本地配置（恢复时不动 localStorage）
          default: null
          additionalProperties:
            type: string
          propertyNames:
            type: string
      additionalProperties: false
    BackupInspectResult:
      type: object
      description: 备份文件摘要：恢复前的确认框用它在点下去之前展示条目数。
      required:
      - version
      - createdAt
      - books
      - groups
      - bookSources
      - bookmarks
      - replaceRules
      - hasLocalState
      properties:
        bookSources:
          type: integer
          format: int32
          minimum: 0
        bookmarks:
          type: integer
          format: int32
          minimum: 0
        books:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        groups:
          type: integer
          format: int32
          minimum: 0
        hasLocalState:
          type: boolean
          description: 备份是否包含浏览器本地配置（null/缺失 = 不含）
        replaceRules:
          type: integer
          format: int32
          minimum: 0
        version:
          type: integer
          format: int32
          minimum: 0
    BatchContentError:
      type: object
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type:
          - string
          - 'null'
    BatchContentItem:
      type: object
      required:
      - index
      properties:
        data:
          $ref: '#/components/schemas/ChapterContent'
        error:
          $ref: '#/components/schemas/BatchContentError'
        index:
          type: integer
          format: int32
    BatchContentRequest:
      type: object
      required:
      - indices
      properties:
        indices:
          type: array
          items:
            type: integer
            format: int32
      additionalProperties: false
    BatchContentResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchContentItem'
    BatchDeleteMarksResult:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: integer
          format: int32
          minimum: 0
    BatchDeleteRequest:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            type: string
      additionalProperties: false
    BatchDeleteSourcesRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
      additionalProperties: false
    BatchDeleteSourcesResult:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: integer
          format: int32
          minimum: 0
    BatchSaveMarksResult:
      type: object
      required:
      - saved
      - skipped
      properties:
        saved:
          type: integer
          format: int32
          minimum: 0
        skipped:
          type: integer
          format: int32
          description: 指向未登记书籍的条目被跳过（没有归属信息，存进去只会在 id 复用时串书）
          minimum: 0
    BatchUpsertRequest:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ReplaceRuleWrite'
      additionalProperties: false
    BatchUpsertSourcesRequest:
      type: object
      required:
      - sources
      properties:
        sources:
          type: array
          items: {}
          description: 源材料数组（宽松迁移；单项解析失败整批 400）
      additionalProperties: false
    BatchUpsertSourcesResult:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
    Book:
      type: object
      properties:
        author:
          type: string
          default: ''
        bookId:
          type:
          - string
          - 'null'
          description: 后端分配的稳定身份（`book_<n>`），不随换源变化；请求身份参数一律用它。
          default: null
        bookSourceId:
          type:
          - integer
          - 'null'
          format: int64
          description: 当前绑定的书源 id；与 `origin`（书源 URL，数据字段）并行保存。
          default: null
        bookUrl:
          type: string
          default: ''
        canReName:
          type:
          - string
          - 'null'
          default: null
        canUpdate:
          type:
          - boolean
          - 'null'
          default: null
        charset:
          type:
          - string
          - 'null'
          default: null
        coverUrl:
          type:
          - string
          - 'null'
          default: null
        customCoverUrl:
          type:
          - string
          - 'null'
          default: null
        downloadUrls:
          type:
          - string
          - 'null'
          default: null
        durChapterIndex:
          type:
          - integer
          - 'null'
          format: int32
          default: null
        durChapterPos:
          type:
          - integer
          - 'null'
          format: int32
          default: null
        durChapterTime:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        durChapterTitle:
          type:
          - string
          - 'null'
          default: null
        group:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        infoHtml:
          type:
          - string
          - 'null'
          default: null
        intro:
          type:
          - string
          - 'null'
          default: null
        kind:
          type:
          - string
          - 'null'
          default: null
        lastCheckTime:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        latestChapterTitle:
          type:
          - string
          - 'null'
          default: null
        name:
          type: string
          default: ''
        origin:
          type: string
          default: ''
        originName:
          type:
          - string
          - 'null'
          default: null
        tocHtml:
          type:
          - string
          - 'null'
          default: null
        tocUrl:
          type:
          - string
          - 'null'
          default: null
        totalChapterNum:
          type:
          - integer
          - 'null'
          format: int32
          default: null
        type:
          type:
          - integer
          - 'null'
          format: int32
          default: null
        updateTime:
          type:
          - string
          - 'null'
          default: null
        wordCount:
          type:
          - string
          - 'null'
          default: null
    BookDetail:
      type: object
      required:
      - id
      - name
      - bookUrl
      - stale
      properties:
        author:
          type:
          - string
          - 'null'
        bookUrl:
          type: string
          description: 上游地址：只读诊断字段（红线 6 例外之外的只读输出）
        coverImageId:
          type:
          - string
          - 'null'
          description: |-
            封面在图片管道中的 id（md5(去查询串地址)）；取图地址随 images 域
            切换迁移（当前 /reader3/image/<id>）
        coverUrl:
          type:
          - string
          - 'null'
          description: |-
            站内资源封面地址（本地 EPUB 的 `/reader3/localEpubAsset?...`）；
            与 `coverImageId` 二选一，客户端直接渲染
        id:
          type: string
          description: 不透明 id（`book_<n>`）
        intro:
          type:
          - string
          - 'null'
        kind:
          type:
          - string
          - 'null'
        lastChapter:
          oneOf:
          - $ref: '#/components/schemas/LastChapter'
          - type: 'null'
        name:
          type: string
        sourceId:
          type:
          - string
          - 'null'
          description: 绑定书源；null 表示本地书
        stale:
          type: boolean
          description: 上游详情获取失败，当前是登记行回退数据
        totalChapters:
          type:
          - integer
          - 'null'
          format: int32
          description: 章节登记表的章节数（目录未抓时缺省）
          minimum: 0
    BookGroup:
      type: object
      required:
      - groupName
      properties:
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        orderNo:
          type: integer
          format: int32
    BookGroupOrderItem:
      type: object
      description: |-
        分组排序的单条提交项（`POST /reader3/saveBookGroupOrder`）。

        排序接口**只改顺序**：不带 `groupName`，因此调用方不可能借排序接口
        改名/建组/删组——增删改的唯一入口是 `/saveBookGroup` 与
        `/deleteBookGroup`。旧版用整表 `Vec<BookGroup>` 覆盖，不在数组里的组
        会被删除并清掉书上的位，一个「上下移」的误提交就能丢掉分组。
      required:
      - groupId
      - orderNo
      properties:
        groupId:
          type: integer
          format: int64
        orderNo:
          type: integer
          format: int32
    BookInfoRule:
      type: object
      properties:
        author:

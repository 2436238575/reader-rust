openapi: 3.1.0
info:
  title: reader-rust v1 API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: 登录。
      description: |-
        失败统一 401 `INVALID_CREDENTIALS`（不区分账号不存在与密码错误）；
        限速命中回 429 `RATE_LIMITED` + `Retry-After`。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功，Set-Cookie 下发会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 用户名或密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求体超过 1MB 上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 不是 application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 登录失败次数过多
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: |-
        登出：吊销 refresh 会话家族并清除两枚 Cookie。幂等——Cookie 缺失或
        令牌已损坏同样返回 204。
      operationId: logout
      responses:
        '204':
          description: 已登出并清除 Cookie
  /v1/auth/password:
    post:
      tags:
      - auth
      summary: |-
        修改密码：吊销其他会话（token_version 自增），当前设备用换发的新令牌
        继续使用，避免改完密码被登出。
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: 已修改并换发当前会话
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或当前密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求体超过 1MB 上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 不是 application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 用一次性 Refresh Token 换一对新令牌（轮换 + 30 秒宽限 + 重放吊销家族）。
      description: |-
        只认 `reader_refresh` Cookie。失败按原因细分并清除两枚 Cookie：
        `AUTH_EXPIRED`（无效/过期，静默失败）与 `AUTH_REFRESH_REPLAYED`
        （重放检测，会话已吊销，必须重新登录）。
      operationId: refreshToken
      responses:
        '200':
          description: 换发成功，Set-Cookie 下发新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '401':
          description: 令牌无效/过期或重放检测命中，附清除 Cookie
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/books/{bookId}/chapters:
    get:
      tags:
      - books
      summary: 章节列表。
      operationId: listChapters
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（bk_<n>）
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: 章节页（按 index 升序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterPage'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: limit 超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/{index}/content:
    get:
      tags:
      - books
      summary: 章节正文。
      operationId: getChapterContent
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号（登记表分配的稳定序号）
        required: true
        schema:
          type: integer
          format: int32
      - name: variant
        in: query
        description: default（用户选择）或 upstream（上游预览）
        required: false
        schema:
          type: string
      - name: refresh
        in: query
        description: 同步回源一次，失败回退已有缓存
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 章节正文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContent'
        '304':
          description: If-None-Match 命中当前版本，客户端用缓存正文
        '400':
          description: variant 取值非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍或章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me:
    get:
      tags:
      - me
      summary: 当前账号资料。
      description: 时间字段统一由服务端下发，客户端时钟不参与任何比较（契约 §5.2）。
      operationId: getMe
      responses:
        '200':
          description: 当前账号资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或令牌失效，客户端应静默刷新或重新登录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 服务端错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/sources:
    get:
      tags:
      - sources
      summary: 书源列表。
      description: 书源摘要页。排序固定为 id 升序（创建顺序）；游标 keyset 依赖不可变排序键。
      operationId: listSources
      parameters:
      - name: q
        in: query
        description: 名称或 URL 的大小写不敏感子串
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: 书源摘要页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: limit 超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type:
          - string
          - 'null'
        newPassword:
          type:
          - string
          - 'null'
    ChapterContent:
      type: object
      description: 章节正文（v1 形状）。`format` 由服务端统一判定并下发（契约 §9.5）。
      required:
      - bookId
      - index
      - format
      - body
      - upstreamChangedSinceBase
      - selectionSource
      - stale
      properties:
        body:
          type: string
        bookId:
          type: string
        fetchedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次回源成功时间，RFC 3339 UTC
        format:
          type: string
          description: '`text` 或 `html`（服务端统一判定，D15）'
        index:
          type: integer
          format: int32
        latestUpstreamVersionId:
          type:
          - string
          - 'null'
        selectionSource:
          type: string
          description: '`selected` / `edited` / `upstream` / `upstream_preview`'
        stale:
          type: boolean
          description: 到期未回源或最近一次回源失败（旧数据，仍可读）
        upstreamChangedSinceBase:
          type: boolean
          description: 用户版本的基准上游之后，上游是否又变过
        version:
          oneOf:
          - $ref: '#/components/schemas/ChapterVersionInfo'
          - type: 'null'
    ChapterItem:
      type: object
      description: 章节条目：身份是 `index`（书籍内稳定序号，换源整表替换）。
      required:
      - index
      - title
      - titleOverridden
      - isVip
      - isPay
      - isVolume
      properties:
        index:
          type: integer
          format: int32
        isPay:
          type: boolean
        isVip:
          type: boolean
        isVolume:
          type: boolean
        title:
          type: string
        titleOverridden:
          type: boolean
          description: 用户改名覆盖生效中（改名走 `chapter_title_overrides`，不写回上游标题）
        volume:
          type:
          - string
          - 'null'
        wordCount:
          type:
          - string
          - 'null'
    ChapterPage:
      type: object
      description: '游标分页容器（契约 §5.4）：`nextCursor: null` 表示到底。'
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChapterItem'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ChapterVersionInfo:
      type: object
      description: 当前解析版本的信息。`basedOn` 只记录编辑时基于哪一版（历史信息）。
      required:
      - id
      - kind
      properties:
        basedOn:
          type:
          - string
          - 'null'
        id:
          type: string
          description: 不透明版本 id（`cv_<n>`），同时是 If-None-Match 的实体标签
        kind:
          type: string
          description: '`upstream` / `edited` / `imported`'
    ErrorCode:
      type: string
      description: |-
        错误码：线上值是大写下划线（serde `SCREAMING_SNAKE_CASE`），稳定不变。
        新增取值是兼容变更（客户端必须有 default 分支），改已有取值的语义是破坏变更。
      enum:
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - INVALID_CURSOR
      - INVALID_CREDENTIALS
      - AUTH_EXPIRED
      - AUTH_REFRESH_REPLAYED
      - SESSION_INVALID
      - CSRF_HEADER_MISSING
      - SCOPE_FORBIDDEN
      - BOOK_NOT_FOUND
      - CHAPTER_NOT_FOUND
      - SOURCE_NOT_FOUND
      - IMAGE_NOT_FOUND
      - TASK_NOT_FOUND
      - NOT_FOUND
      - BOOK_NOT_IN_SHELF
      - SOURCE_DISABLED
      - TASK_ALREADY_RUNNING
      - CONFLICT
      - VERSION_CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - RATE_LIMITED
      - UPSTREAM_BLOCKED
      - UPSTREAM_FAILED
      - UPSTREAM_TIMEOUT
      - PROCESSING_TIMEOUT
      - TASK_LIMIT
      - API_REMOVED
      - UNKNOWN_FIELD
      - INTERNAL
    FieldIssue:
      type: object
      description: 422 校验失败的逐字段错误：`pointer` 是 JSON Pointer，前端直接映射表单控件。
      required:
      - pointer
      - code
      properties:
        code:
          type: string
        detail:
          type: string
        pointer:
          type: string
    LoginRequest:
      type: object
      properties:
        password:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
    Me:
      type: object
      description: |-
        当前账号资料。`id` 是不透明字符串（`u_<uid>`），客户端不解析。
        `createdAt` 一律 RFC 3339 UTC（契约红线 7）。
      required:
      - id
      - username
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: 注册时间，RFC 3339 UTC
        id:
          type: string
        username:
          type: string
    Problem:
      type: object
      description: |-
        problem+json 响应体。`type` 固定 `about:blank`（RFC 9457 缺省类型，
        语义由 `code` 承载，不要求维护错误文档页）。
      required:
      - type
      - code
      - status
      - title
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        instance:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
        upstreamCode:
          type: string
          description: 上游业务码原样透传（FQWeb 的 `UPSTREAM_THROTTLED` 等）
    SessionTokens:
      type: object
      description: |-
        会话令牌对。`accessToken` 供非浏览器客户端走 `Authorization: Bearer`；
        浏览器只依赖 HttpOnly Cookie，`refreshToken` 永不进响应体。
      required:
      - accessToken
      - accessTokenExpiresAt
      - username
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: access token 的过期时间，RFC 3339 UTC
        username:
          type: string
          description: 登录用户名（hint 展示与 API 客户端识别；/v1/me 才是资料源）
    SourcePage:
      type: object
      description: '游标分页容器（契约 §5.4）：`nextCursor: null` 表示到底。'
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceSummary'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type:
          - integer
          - 'null'
          format: int32
          description: 过滤后的总数（小表直接算，不做惰性统计）
          minimum: 0
    SourceSummary:
      type: object
      description: 书源摘要：展示字段 + `exploreUrl`，不含规则 JSON。
      required:
      - id
      - name
      - url
      - enabled
      - enabledExplore
      - enabledCookieJar
      properties:
        customOrder:
          type:
          - integer
          - 'null'
          format: int32
        enabled:
          type: boolean
        enabledCookieJar:
          type: boolean
        enabledExplore:
          type: boolean
        exploreUrl:
          type:
          - string
          - 'null'
        group:
          type:
          - string
          - 'null'
        id:
          type: string
          description: 不透明 id（`src_<n>`），客户端不解析
        name:
          type: string
        respondTime:
          type:
          - integer
          - 'null'
          format: int64
        type:
          type:
          - integer
          - 'null'
          format: int32
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 源材料里的更新时间（服务端存毫秒），输出 RFC 3339 UTC
        url:
          type: string
        weight:
          type:
          - integer
          - 'null'
          format: int32
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: reader_access
      description: 会话 Cookie（HttpOnly），登录后由服务端下发
tags:
- name: me
  description: 当前账号
- name: auth
  description: 会话认证
- name: sources
  description: 书源
- name: books
  description: 书籍与章节

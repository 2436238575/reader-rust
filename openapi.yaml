          type: array
          items:
            $ref: '#/components/schemas/SearchBook'
    TaskKind:
      type: string
      enum:
      - search
      - explore
      - source-test
      - source-import
      - prefetch-cache
      - chapter-import
      - ai-generate
      - ai-chat
    TaskPage:
      type: object
      description: 任务列表（`GET /v1/tasks`）。
      required:
      - items
      - nextCursor
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskView'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          format: int32
          minimum: 0
    TaskProgress:
      type: object
      required:
      - done
      - total
      - unit
      - message
      properties:
        done:
          type: integer
          format: int32
          minimum: 0
        message:
          type:
          - string
          - 'null'
        total:
          type: integer
          format: int32
          minimum: 0
        unit:
          type: string
          description: 进度单位：`source`（搜索书源数）等
    TaskResultPage:
      type: object
      description: 搜索结果分页（`GET /v1/tasks/{id}/result`）。
      required:
      - items
      - nextCursor
      - total
      - truncated
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchBook'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          format: int32
          description: 当前结果集条数（去重后；截断后只算保留部分）
          minimum: 0
        truncated:
          type: boolean
          description: 结果集超过 10MB / 全局预算，后续条目已丢弃
    TaskResultResponse:
      oneOf:
      - $ref: '#/components/schemas/TaskResultPage'
      - $ref: '#/components/schemas/PrefetchSummary'
      - $ref: '#/components/schemas/SourceTestResult'
      - $ref: '#/components/schemas/SourceImportResult'
      description: 任务结果：search 是结果分页，其余 kind 是各自的摘要。
    TaskState:
      type: string
      enum:
      - queued
      - running
      - cancelling
      - succeeded
      - failed
      - cancelled
    TaskView:
      type: object
      description: 任务资源（`GET /v1/tasks/{id}` 的响应）。
      required:
      - id
      - kind
      - state
      - progress
      - createdAt
      - startedAt
      - finishedAt
      - resultHref
      - error
      properties:
        createdAt:
          type: string
          format: date-time
        error:
          oneOf:
          - $ref: '#/components/schemas/Problem'
            description: 失败时的完整 problem+json 对象
          - type: 'null'
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
        kind:
          $ref: '#/components/schemas/TaskKind'
        progress:
          $ref: '#/components/schemas/TaskProgress'
        resultHref:
          type:
          - string
          - 'null'
          description: 结果分页地址；没有结果时为 null
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        state:
          $ref: '#/components/schemas/TaskState'
    TocRule:
      type: object
      properties:
        chapterList:
          type:
          - string
          - 'null'
          default: null
        chapterName:
          type:
          - string
          - 'null'
          default: null
        chapterUrl:
          type:
          - string
          - 'null'
          default: null
        formatJs:
          type:
          - string
          - 'null'
          default: null
        init:
          type:
          - string
          - 'null'
          default: null
        isPay:
          type:
          - string
          - 'null'
          default: null
        isVip:
          type:
          - string
          - 'null'
          default: null
        isVolume:
          type:
          - string
          - 'null'
          default: null
        nextTocUrl:
          type:
          - string
          - 'null'
          default: null
        preUpdateJs:
          type:
          - string
          - 'null'
          default: null
        updateTime:
          type:
          - string
          - 'null'
          default: null
        volumeName:
          type:
          - string
          - 'null'
          description: |-
            卷名（本项目扩展）：规则挂在每个章节条目上，
            目录 UI 把卷名相同的连续章节归到同一个卷标题下
          default: null
        wordCount:
          type:
          - string
          - 'null'
          description: 字数（本项目扩展）：目录里随章节条目展示
          default: null
    UserdataBatchDoc:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
        value:
          description: 整文档新值；缺失 422（不能把「忘传内容」当成删文档）
      additionalProperties: false
    UserdataBatchSaveRequest:
      type: object
      required:
      - docs
      properties:
        docs:
          type: array
          items:
            $ref: '#/components/schemas/UserdataBatchDoc'
      additionalProperties: false
    UserdataBatchSaveResult:
      type: object
      required:
      - saved
      properties:
        saved:
          type: integer
          format: int32
          minimum: 0
    WebdavBackupBookmark:
      type: object
      description: |-
        备份里的书签。与 `Bookmark` 的唯一差别是多一个 `bookUrl`：书架外的书签
        没有 `bookshelf.books` 条目可映射，恢复时按 URL 找回登记行，避免把
        「已移出书架但仍有书签」的数据静默丢掉。旧备份没有该字段，按 id 映射
        兜底（映射不上则计入 skipped）。
      properties:
        bookAuthor:
          type: string
          default: ''
        bookId:
          type: string
          default: ''
        bookName:
          type: string
          default: ''
        bookText:
          type: string
          default: ''
        bookUrl:
          type:
          - string
          - 'null'
          description: 备份时的登记表 URL；书架内的书签可省略（按 bookId 映射即可）
          default: null
        chapterIndex:
          type: integer
          format: int32
          default: 0
        chapterName:
          type: string
          default: ''
        chapterPos:
          type: integer
          format: int32
          default: 0
        content:
          type: string
          default: ''
        kind:
          type: string
          default: ''
        time:
          type: integer
          format: int64
          default: 0
    WebdavBackupBookshelf:
      type: object
      required:
      - books
      - groups
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
          description: 书架顺序（`get_bookshelf_ordered` 的位置顺序）
        groups:
          type: array
          items:
            $ref: '#/components/schemas/BookGroup'
    WebdavBackupDocument:
      type: object
      description: |-
        备份文档。**必填域不能缺**：`bookshelf.books/groups`、`bookSources`、
        `bookmarks`、`replaceRules` 少任何一个都会在反序列化阶段 422，绝不按
        空数组继续——否则一个 `{"version":1}` 就能把全部数据清空。
      required:
      - version
      - bookshelf
      - bookSources
      - bookmarks
      - replaceRules
      properties:
        app:
          type: string
        bookSources:
          type: array
          items:
            $ref: '#/components/schemas/BookSource'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/WebdavBackupBookmark'
        bookshelf:
          $ref: '#/components/schemas/WebdavBackupBookshelf'
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC；旧备份/手写文档允许缺省
        localState:
          type:
          - object
          - 'null'
          description: 浏览器本地配置快照；`None` = 这份备份不含本地配置（恢复时不清本地键）
          additionalProperties:
            type: string
          propertyNames:
            type: string
        replaceRules:
          type: array
          items:
            $ref: '#/components/schemas/ReplaceRule'
        version:
          type: integer
          format: int32
          minimum: 0
    WebdavBatchDeleteRequest:
      type: object
      required:
      - paths
      properties:
        paths:
          type: array
          items:
            type: string
      additionalProperties: false
    WebdavBatchDeleteResult:
      type: object
      required:
      - deleted
      - missing
      properties:
        deleted:
          type: integer
          format: int32
          minimum: 0
        missing:
          type: integer
          format: int32
          minimum: 0
    WebdavEntry:
      type: object
      description: 目录/文件条目。`modifiedAt` 与 v1 其他时间字段一致用 RFC 3339 UTC。
      required:
      - name
      - path
      - size
      - isDirectory
      - modifiedAt
      properties:
        isDirectory:
          type: boolean
        modifiedAt:
          type: string
          format: date-time
        name:
          type: string
        path:
          type: string
          description: 相对用户 WebDAV 根目录的路径（`/backups/a.json`）
        size:
          type: integer
          format: int64
          minimum: 0
    WebdavRestoreResult:
      type: object
      description: |-
        恢复结果：各域处理条数与需要前端落地的 localStorage 快照。

        计数是**提交条数**：重复身份（同 URL 书源、同名规则、同五元组书签）会被
        存储层 upsert 折叠，最终行数可能更少。
      required:
      - books
      - groups
      - bookSources
      - bookmarks
      - skippedBookmarks
      - replaceRules
      properties:
        bookSources:
          type: integer
          format: int32
          minimum: 0
        bookmarks:
          type: integer
          format: int32
          minimum: 0
        books:
          type: integer
          format: int32
          minimum: 0
        groups:
          type: integer
          format: int32
          minimum: 0
        localState:
          type:
          - object
          - 'null'
          description: '`None` = 备份本身不含本地配置，前端不应改动现有 localStorage'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        replaceRules:
          type: integer
          format: int32
          minimum: 0
        skippedBookmarks:
          type: integer
          format: int32
          description: 指向备份书架之外的书籍而跳过的书签数
          minimum: 0
    WebdavUploadForm:
      type: object
      description: |-
        multipart 上传的表单形态（只服务 OpenAPI 文档；运行时由 `V1Multipart`
        逐字段解析）。`file` 对应可重复的文件字段。
      required:
      - file
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: reader_access
      description: 会话 Cookie（HttpOnly），登录后由服务端下发
tags:
- name: me
  description: 当前账号
- name: auth
  description: 会话认证
- name: sources
  description: 书源
- name: books
  description: 书籍与章节
- name: tasks
  description: 任务、搜索与 SSE 事件流
- name: files
  description: 服务器文件浏览与备份恢复

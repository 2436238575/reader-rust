openapi: 3.1.0
info:
  title: reader-rust v1 API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: 登录。
      description: |-
        失败统一 401 `INVALID_CREDENTIALS`（不区分账号不存在与密码错误）；
        限速命中回 429 `RATE_LIMITED` + `Retry-After`。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功，Set-Cookie 下发会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '401':
          description: 用户名或密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 登录失败次数过多
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: |-
        登出：吊销 refresh 会话家族并清除两枚 Cookie。幂等——Cookie 缺失或
        令牌已损坏同样返回 204。
      operationId: logout
      responses:
        '204':
          description: 已登出并清除 Cookie
  /v1/auth/password:
    post:
      tags:
      - auth
      summary: |-
        修改密码：吊销其他会话（token_version 自增），当前设备用换发的新令牌
        继续使用，避免改完密码被登出。
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: 已修改并换发当前会话
        '401':
          description: 未登录或当前密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 用一次性 Refresh Token 换一对新令牌（轮换 + 30 秒宽限 + 重放吊销家族）。
      description: |-
        只认 `reader_refresh` Cookie。失败按原因细分并清除两枚 Cookie：
        `AUTH_EXPIRED`（无效/过期，静默失败）与 `AUTH_REFRESH_REPLAYED`
        （重放检测，会话已吊销，必须重新登录）。
      operationId: refreshToken
      responses:
        '200':
          description: 换发成功，Set-Cookie 下发新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '401':
          description: 令牌无效/过期或重放检测命中，附清除 Cookie
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me:
    get:
      tags:
      - me
      summary: 当前账号资料。
      description: 时间字段统一由服务端下发，客户端时钟不参与任何比较（契约 §5.2）。
      operationId: getMe
      responses:
        '200':
          description: 当前账号资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或令牌失效，客户端应静默刷新或重新登录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 服务端错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type:
          - string
          - 'null'
        newPassword:
          type:
          - string
          - 'null'
    ErrorCode:
      type: string
      description: |-
        错误码：线上值是大写下划线（serde `SCREAMING_SNAKE_CASE`），稳定不变。
        新增取值是兼容变更（客户端必须有 default 分支），改已有取值的语义是破坏变更。
      enum:
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - INVALID_CURSOR
      - INVALID_CREDENTIALS
      - AUTH_EXPIRED
      - AUTH_REFRESH_REPLAYED
      - SESSION_INVALID
      - CSRF_HEADER_MISSING
      - SCOPE_FORBIDDEN
      - BOOK_NOT_FOUND
      - CHAPTER_NOT_FOUND
      - SOURCE_NOT_FOUND
      - IMAGE_NOT_FOUND
      - TASK_NOT_FOUND
      - NOT_FOUND
      - BOOK_NOT_IN_SHELF
      - SOURCE_DISABLED
      - TASK_ALREADY_RUNNING
      - CONFLICT
      - VERSION_CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - RATE_LIMITED
      - UPSTREAM_BLOCKED
      - UPSTREAM_FAILED
      - UPSTREAM_TIMEOUT
      - PROCESSING_TIMEOUT
      - TASK_LIMIT
      - API_REMOVED
      - UNKNOWN_FIELD
      - INTERNAL
    FieldIssue:
      type: object
      description: 422 校验失败的逐字段错误：`pointer` 是 JSON Pointer，前端直接映射表单控件。
      required:
      - pointer
      - code
      properties:
        code:
          type: string
        detail:
          type: string
        pointer:
          type: string
    LoginRequest:
      type: object
      properties:
        password:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
    Me:
      type: object
      description: |-
        当前账号资料。`id` 是不透明字符串（`u_<uid>`），客户端不解析。
        `createdAt` 一律 RFC 3339 UTC（契约红线 7）。
      required:
      - id
      - username
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: 注册时间，RFC 3339 UTC
        id:
          type: string
        username:
          type: string
    Problem:
      type: object
      description: |-
        problem+json 响应体。`type` 固定 `about:blank`（RFC 9457 缺省类型，
        语义由 `code` 承载，不要求维护错误文档页）。
      required:
      - type
      - code
      - status
      - title
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        instance:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
        upstreamCode:
          type: string
          description: 上游业务码原样透传（FQWeb 的 `UPSTREAM_THROTTLED` 等）
    SessionTokens:
      type: object
      description: |-
        会话令牌对。`accessToken` 供非浏览器客户端走 `Authorization: Bearer`；
        浏览器只依赖 HttpOnly Cookie，`refreshToken` 永不进响应体。
      required:
      - accessToken
      - accessTokenExpiresAt
      - username
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: access token 的过期时间，RFC 3339 UTC
        username:
          type: string
          description: 登录用户名（hint 展示与 API 客户端识别；/v1/me 才是资料源）
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: reader_access
      description: 会话 Cookie（HttpOnly），登录后由服务端下发
tags:
- name: me
  description: 当前账号
- name: auth
  description: 会话认证

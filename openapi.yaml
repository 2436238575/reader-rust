          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/me/shelf:order:
    patch:
      tags:
      - me
      summary: 只改书架顺序（只写 position 一列，其余字段原样保留）。
      description: |-
        必须提交当前书架的**完整集合**：缺书/多书说明客户端视图已过期，整批
        拒绝（422「书架已变化，请刷新后重试」），避免部分提交把顺序写乱。

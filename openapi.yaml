openapi: 3.1.0
info:
  title: reader-rust v1 API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: 登录。
      description: |-
        失败统一 401 `INVALID_CREDENTIALS`（不区分账号不存在与密码错误）；
        限速命中回 429 `RATE_LIMITED` + `Retry-After`。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功，Set-Cookie 下发会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 用户名或密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求体超过 1MB 上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 不是 application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 登录失败次数过多
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: |-
        登出：吊销 refresh 会话家族并清除两枚 Cookie。幂等——Cookie 缺失或
        令牌已损坏同样返回 204。
      operationId: logout
      responses:
        '204':
          description: 已登出并清除 Cookie
  /v1/auth/password:
    post:
      tags:
      - auth
      summary: |-
        修改密码：吊销其他会话（token_version 自增），当前设备用换发的新令牌
        继续使用，避免改完密码被登出。
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: 已修改并换发当前会话
        '400':
          description: 请求体不是合法 JSON 或字段类型不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或当前密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求体超过 1MB 上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type 不是 application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 用一次性 Refresh Token 换一对新令牌（轮换 + 30 秒宽限 + 重放吊销家族）。
      description: |-
        只认 `reader_refresh` Cookie。失败按原因细分并清除两枚 Cookie：
        `AUTH_EXPIRED`（无效/过期，静默失败）与 `AUTH_REFRESH_REPLAYED`
        （重放检测，会话已吊销，必须重新登录）。
      operationId: refreshToken
      responses:
        '200':
          description: 换发成功，Set-Cookie 下发新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '401':
          description: 令牌无效/过期或重放检测命中，附清除 Cookie
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/books/{bookId}:
    get:
      tags:
      - books
      summary: 书籍详情：详情规则求值（1h 缓存）+ 章节登记表的统计切片。
      operationId: getBook
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 书籍详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    patch:
      tags:
      - books
      summary: 改书名/作者（登记表列；merge-patch，只写出现的字段）。
      description: |-
        intro/kind/wordCount/cover 的存储还在 `shelf_books`（元数据迁移未做），
        本端点暂不收——传入即 422 `UNKNOWN_FIELD`。
      operationId: patchBook
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
        required: true
      responses:
        '204':
          description: 已更新
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 未知字段（本端点只收 name/author）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/cache:
    post:
      tags:
      - cache
      summary: '预下载章节到正文池：202 + `Location: /v1/tasks/{id}`。'
      operationId: prefetchBookCache
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: 幂等键（≤200 字符）
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefetchRequest'
        required: true
      responses:
        '202':
          description: 任务已入队
          headers:
            Location:
              schema:
                type: string
              description: 任务资源地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: count 越界
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 本地书 / 目录为空 / from 越界
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 并发任务超限，带 Retry-After
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - books
      summary: |-
        书籍级清理：重置目录抓取状态并删除换源候选；登记行、章节登记表与正文
        历史不动（离线阅读与重新入架都接得上）。幂等。
      operationId: deleteBookCache
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 已清理（幂等）
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/cache-search:
    get:
      tags:
      - books
      summary: |-
        缓存内全文检索：只扫本书已缓存的章节正文，不触发任何上游请求。
        与远程搜书（`POST /v1/searches`）无关；本地书不在检索范围。
      operationId: searchCachedContent
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: q
        in: query
        description: 检索词，1..=100 字符
        required: true
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        description: 命中章节上限 1..=200，缺省 50
        required: false
        schema:
          type: integer
          format: int32
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: 按章聚合的命中与检索覆盖度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CachedSearchResponse'
        '400':
          description: 查询参数类型非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: q 为空/超长或 limit 越界
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapter-marks:
    get:
      tags:
      - books
      summary: 每章当前显示版本的标记（目录版本标签用）；没有的章按「最新上游」处理。
      operationId: getChapterVersionMarks
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 章节地址 → 标记
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterVersionMarksPayload'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters:
    get:
      tags:
      - books
      summary: 章节列表。
      description: |-
        `refresh=true` 是用户显式刷新：上游失败直接 502，不回退旧登记表
        （静默成功会掩盖书源已失效）；普通读才用旧目录兜底并标 `stale`。
      operationId: listChapters
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 上一页的 nextCursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 页大小，默认 50，上限 200
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: refresh
        in: query
        description: 同步重抓目录（只对第一页生效）
        required: false
        schema:
          type: boolean
      - name: tocVersion
        in: query
        description: 第一页的 tocVersion，续页回传用于检测目录快照已刷新
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 章节页（按 index 升序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterPage'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: limit 超上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 目录已刷新（tocVersion 不匹配），客户端从第一页重拉
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 游标无法解码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 上游失败；refresh=true 时不回退旧目录，如实报错
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/import-diff:
    get:
      tags:
      - books
      summary: 预览里点开某一章时，按需算它和当前正文的差异。
      operationId: getChapterImportDiff
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: previewId
        in: query
        description: 预览令牌
        required: true
        schema:
          type: string
      - name: sourceIndex
        in: query
        description: TXT 切章后的下标
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 逐段差异
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterImportDiffPayload'
        '400':
          description: 章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 预览已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/{index}:
    patch:
      tags:
      - books
      summary: 改当前章节名（持久覆盖层；与目录原标题相同按恢复原名处理）。
      operationId: renameChapter
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameChapterRequest'
        required: true
      responses:
        '200':
          description: 改名结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterTitlePayload'
        '400':
          description: 标题过长
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/{index}/comments:
    get:
      tags:
      - books
      summary: 章评 / 段评（`?para=`）；`?authorOnly=true` 忽略分页扫描作者评论。
      operationId: getChapterComments
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号（登记表分配的稳定序号）
        required: true
        schema:
          type: integer
          format: int32
      - name: para
        in: query
        description: 段号（>=0）：提供即查段评，缺省查章评
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: 页码，从 1 起
        required: false
        schema:
          type: integer
          format: int32
      - name: count
        in: query
        description: 每页条数，默认 20，上限 50
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: hot（默认）或 time
        required: false
        schema:
          type: string
      - name: authorOnly
        in: query
        description: 忽略分页扫描作者评论
        required: false
        schema:
          type: boolean
      - name: refresh
        in: query
        description: 忽略 7 天评论缓存重抓
        required: false
        schema:
          type: boolean
      - name: variant
        in: query
        description: edited（默认）或 upstream
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 评论页（enabled=false 表示书源没声明评论规则）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse_ReviewPage'
        '400':
          description: para 取值非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍或章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/{index}/comments/index:
    get:
      tags:
      - books
      summary: 段评概览：本章哪些段落有段评、各有多少条。
      operationId: getCommentIndex
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号
        required: true
        schema:
          type: integer
          format: int32
      - name: refresh
        in: query
        description: 忽略缓存重抓
        required: false
        schema:
          type: boolean
      - name: variant
        in: query
        description: edited（默认）或 upstream
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 段评概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse_ParaReviewIndex'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍或章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/books/{bookId}/chapters/{index}/content:
    get:
      tags:
      - books
      summary: 章节正文。
      operationId: getChapterContent
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号（登记表分配的稳定序号）
        required: true
        schema:
          type: integer
          format: int32
      - name: variant
        in: query
        description: default（用户选择）或 upstream（上游预览）
        required: false
        schema:
          type: string
      - name: refresh
        in: query
        description: 同步回源一次，失败回退已有缓存
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 章节正文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContent'
        '304':
          description: If-None-Match 命中当前版本，客户端用缓存正文
        '400':
          description: variant 取值非法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍或章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
      - bearerAuth: []
    put:
      tags:
      - books
      summary: 保存编辑（生成新用户版本，设为当前显示）。
      operationId: saveChapterContent
      parameters:
      - name: bookId
        in: path
        description: 书籍 id（book_<n>）
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: 章节序号
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditChapterRequest'
        required: true
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterWriteResult'
        '400':
          description: baseVersionId 不属于本章
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未登录或令牌失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 书籍或章节不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

          propertyNames:
            type: string
    ChapterWriteResult:
      type: object
      required:
      - edited
      - versionId
      properties:
        edited:
          type: boolean
        versionId:
          type: string
    ChunkUploadPayload:
      type: object
      description: 分片上传结果（typed；线缆与 /reader3 逐字段一致）。
      required:
      - uploadId
      - received
      - complete
      properties:
        complete:
          type: boolean
        received:
          type: integer
          format: int64
          description: 服务端当前已收到的字节数（重发同一片时可能大于本次分片末尾）。
          minimum: 0
        uploadId:
          type: string
    ContentCacheStats:
      type: object
      description: 正文历史（正文池 + 版本时间线）的只读统计：严格保留、不提供清理入口。
      required:
      - files
      - bytes
      - chapters
      - versions
      properties:
        bytes:
          type: integer
          format: int64
          minimum: 0
        chapters:
          type: integer
          format: int64
          minimum: 0
        files:
          type: integer
          format: int64
          minimum: 0
        versions:
          type: integer
          format: int64
          minimum: 0
    ContentImageRule:
      type: object
      description: |-
        章节配图规则（本项目扩展，阅读3.0 无此字段）。

        多数书源的配图就写在正文 HTML 里（`<img>`），渲染端直接显示，不需要规则；
        这一组规则是给「配图另走一个接口」的站点用的：先用 `imageUrl` 拿配图接口
        的地址，再用 `listRule` 取列表、用各字段规则取单张图的信息。

        `imageUrl` 对**章节正文响应**求值（与 [`ReviewRule::review_url`] 同理），
        所以模板里可以直接引用正文响应里的字段，例如
        `content/image?item_id={{$.data.data.novel_data.item_id}}`。
      properties:
        captionRule:
          type:
          - string
          - 'null'
          description: 图片说明文字，默认 `caption`。
          default: null
        heightRule:
          type:
          - string
          - 'null'
          default: null
        imageUrl:
          type:
          - string
          - 'null'
          description: 配图接口 URL 模板，对章节正文响应求值。
          default: null
        listRule:
          type:
          - string
          - 'null'
          description: 配图列表规则，如 `$.data.images[*]`（HTML 站点写 CSS 选择器）。
          default: null
        paraIndexRule:
          type:
          - string
          - 'null'
          description: |-
            插入位置：正文按 `\n` 切分后的行号（从 0 开始，插在该行之前），
            默认 `para_index`。取不到位置时图片排在章末。
          default: null
        urlRule:
          type:
          - string
          - 'null'
          description: 单张图的地址规则，默认 `url`（HTML 站点默认取 `img` 的 `src`）。
          default: null
        widthRule:
          type:
          - string
          - 'null'
          description: 原始宽高，用于给图片占位（避免加载时页面跳动），默认 `width` / `height`。
          default: null
    ContentRule:
      type: object
      properties:
        content:
          type:
          - string
          - 'null'
          default: null
        imageDecode:
          type:
          - string
          - 'null'
          default: null
        imageStyle:
          type:
          - string
          - 'null'
          default: null
        nextContentUrl:
          type:
          - string
          - 'null'
          default: null
        payAction:
          type:
          - string
          - 'null'
          default: null
        replaceRegex:
          type:
          - string
          - 'null'
          default: null
        sourceRegex:
          type:
          - string
          - 'null'
          default: null
        title:
          type:
          - string
          - 'null'
          default: null
        webJs:
          type:
          - string
          - 'null'
          default: null
    DeleteAllSourcesRequest:
      type: object
      required:
      - confirm
      properties:
        confirm:
          type: string
          description: 必须逐字为 `DELETE_ALL`：清空全部书源是毁灭性操作，用确认体当门槛
      additionalProperties: false
    DeleteAllSourcesResult:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: integer
          format: int64
          minimum: 0
    DiffOp:
      type: object
      required:
      - type
      properties:
        baseIndex:
          type:
          - integer
          - 'null'
          minimum: 0
        baseText:
          type:
          - string
          - 'null'
        editedIndex:
          type:
          - integer
          - 'null'
          minimum: 0
        editedText:
          type:
          - string
          - 'null'
        type:
          type: string
    EditChapterRequest:
      type: object
      required:
      - content
      properties:
        baseVersionId:
          type:
          - string
          - 'null'
          description: 编辑时看到的上游版本（cv_<n>）；缺省取当前最新上游
        content:
          type: string
        note:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErrorCode:
      type: string
      description: |-
        错误码：线上值是大写下划线（serde `SCREAMING_SNAKE_CASE`），稳定不变。
        新增取值是兼容变更（客户端必须有 default 分支），改已有取值的语义是破坏变更。
      enum:
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - INVALID_CURSOR
      - STALE_CURSOR
      - INVALID_CREDENTIALS
      - AUTH_EXPIRED
      - AUTH_REFRESH_REPLAYED
      - SESSION_INVALID
      - CSRF_HEADER_MISSING
      - SCOPE_FORBIDDEN
      - BOOK_NOT_FOUND
      - CHAPTER_NOT_FOUND
      - CHAPTER_EDIT_NOT_FOUND
      - SOURCE_NOT_FOUND
      - IMAGE_NOT_FOUND
      - TASK_NOT_FOUND
      - NOT_FOUND
      - REPLACE_RULE_NOT_FOUND
      - BOOK_NOT_IN_SHELF
      - SOURCE_DISABLED
      - SOURCE_LOGIN_FAILED
      - TASK_ALREADY_RUNNING
      - CONFLICT
      - VERSION_CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - RATE_LIMITED
      - UPSTREAM_BLOCKED
      - UPSTREAM_FAILED
      - UPSTREAM_TIMEOUT
      - PROCESSING_TIMEOUT
      - TASK_LIMIT
      - API_REMOVED
      - UNKNOWN_FIELD
      - INTERNAL
    FetchSourcesRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
      additionalProperties: false
    FieldIssue:
      type: object
      description: 422 校验失败的逐字段错误：`pointer` 是 JSON Pointer，前端直接映射表单控件。
      required:
      - pointer
      - code
      properties:
        code:
          type: string
        detail:
          type: string
        pointer:
          type: string
    ImportChapterRequest:
      type: object
      required:
      - content
      properties:
        baseVersionId:
          type:
          - string
          - 'null'
          description: 编辑时看到的上游版本（cv_<n>）
        content:
          type: string
        createdAt:
          type:
          - integer
          - 'null'
          format: int64
          description: 手动补历史时可指定时间（毫秒）
        makeCurrent:
          type:
          - boolean
          - 'null'
          description: 默认只进时间线，不改变当前显示
        note:
          type:
          - string
          - 'null'
      additionalProperties: false
    LastChapter:
      type: object
      required:
      - index
      - title
      properties:
        index:
          type: integer
          format: int32
        title:
          type: string
    LoginRequest:
      type: object
      properties:
        password:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
    Me:
      type: object
      description: |-
        当前账号资料。`id` 是不透明字符串（`u_<uid>`），客户端不解析。
        `createdAt` 一律 RFC 3339 UTC（契约红线 7）。
      required:
      - id
      - username
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: 注册时间，RFC 3339 UTC
        id:
          type: string
        username:
          type: string
    ParaReviewCount:
      type: object
      description: 段评概览里的一段：哪一段、有多少条、段落原文是什么。
      properties:
        authorCommented:
          type: boolean
          description: 该段有作者评论或点赞（概览接口的标记字段，书源没配规则时恒为 false）。
          default: false
        count:
          type: integer
          format: int64
          default: 0
        paraIndex:
          type: integer
          format: int32
          description: 段号，等于正文按 `\n` 切分后的下标（从 0 开始）。
          default: 0
        text:
          type: string
          description: |-
            段落原文（截断）。段号会因用户的书源替换规则、繁简转换而漂移，
            前端拿它做兜底定位。
          default: ''
    ParaReviewIndex:
      type: object
      description: 段评概览。
      properties:
        paras:
          type: array
          items:
            $ref: '#/components/schemas/ParaReviewCount'
          default: []
    ParaReviewRule:
      type: object
      description: |-
        段评（段落评论）规则。

        阅读3.0 没有段评概念，这是本项目新增的扩展规则；字段命名与
        [`ReviewRule`] 保持一致，便于书源作者套用。

        段评分两步：先用 `indexUrl` 取「哪些段落有评论、各有多少条」的概览，
        再用 `reviewUrl` 取某一段的评论列表。两个 URL 都对章节正文响应求值，
        模板里可额外使用 `{{paraIndex}}`。
      properties:
        authorDiggRule:
          type:
          - string
          - 'null'
          default: null
        authorRule:
          type:
          - string
          - 'null'
          description: 评论者/回复者是作者本人、作者赞过（同 [`ReviewRule`] 的四个字段）。
          default: null
        avatarRule:
          type:
          - string
          - 'null'
          default: null
        contentRule:
          type:
          - string
          - 'null'
          default: null
        diggRule:
          type:
          - string
          - 'null'
          default: null
        hasMoreRule:
          type:
          - string
          - 'null'
          default: null
        idRule:
          type:
          - string
          - 'null'
          default: null
        imageRule:
          type:
          - string
          - 'null'
          description: 评论配图，同 [`ReviewRule::image_rule`]。
          default: null
        indexAuthorCommentedRule:
          type:
          - string
          - 'null'
          description: 从单段数据里取「作者评论/点赞过」标记；规则缺省时该标记恒为 false。
          default: null
        indexCountRule:
          type:
          - string
          - 'null'
          description: 从单段数据里取评论条数。
          default: null
        indexListRule:
          type:
          - string
          - 'null'
          description: 概览里的「段号 → 该段数据」映射，通常是一个对象。
          default: null
        indexUrl:
          type:
          - string
          - 'null'
          description: 段评概览 URL 模板，对章节正文响应求值。
          default: null
        listRule:
          type:
          - string
          - 'null'
          default: null
        nameRule:
          type:
          - string
          - 'null'
          default: null
        postTimeRule:
          type:
          - string
          - 'null'
          default: null
        replyAuthorDiggRule:
          type:
          - string
          - 'null'
          default: null
        replyAuthorRule:
          type:
          - string
          - 'null'
          default: null
        replyContentRule:
          type:
          - string
          - 'null'
          default: null
        replyCountRule:
          type:
          - string
          - 'null'
          description: 回复数。段评列表里通常没有内联回复，只有条数，用于「共 N 条回复」。
          default: null
        replyImageRule:
          type:
          - string
          - 'null'
          description: 回复配图，同 [`ReviewRule::reply_image_rule`]。
          default: null
        replyListRule:
          type:
          - string
          - 'null'
          description: 内联回复列表（有的站点段评也带 `reply_list`）。
          default: null
        replyNameRule:
          type:
          - string
          - 'null'
          default: null
        replyPostTimeRule:
          type:
          - string
          - 'null'
          default: null
        replyToRule:
          type:
          - string
          - 'null'
          default: null
        reviewUrl:
          type:
          - string
          - 'null'
          description: 段评列表 URL 模板；模板里可用 `{{paraIndex}}`。
          default: null
        totalRule:
          type:
          - string
          - 'null'
          default: null
    PrefetchRequest:
      type: object
      description: 预下载范围：`from` 是章节下标（缺省 0），`count` 是章数（缺省 50，1..=1000）。
      properties:
        count:
          type:
          - integer
          - 'null'
          format: int32
          maximum: 1000
          minimum: 1
        from:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      additionalProperties: false
    PrefetchSummary:
      type: object
      description: '`kind=prefetch-cache` 的结果摘要（按章计数）。'
      required:
      - requested
      - cached
      - skipped
      - failed
      properties:
        cached:
          type: integer
          format: int32
          description: 本次真正写入正文池的章数
          minimum: 0
        failed:
          type: integer
          format: int32
          minimum: 0
        requested:
          type: integer
          format: int32
          minimum: 0
        skipped:
          type: integer
          format: int32
          description: 已在缓存中跳过的章数
          minimum: 0
    Problem:
      type: object
      description: |-
        problem+json 响应体。`type` 固定 `about:blank`（RFC 9457 缺省类型，
        语义由 `code` 承载，不要求维护错误文档页）。
      required:
      - type
      - code
      - status
      - title
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        instance:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
        upstreamCode:
          type: string
          description: 上游业务码原样透传（FQWeb 的 `UPSTREAM_THROTTLED` 等）
    ProgressPatch:
      type: object
      required:
      - chapterIndex
      properties:
        chapterIndex:
          type: integer
          format: int32
        chapterTitle:
          type:
          - string
          - 'null'
        offset:
          type:
          - number
          - 'null'
          format: double
          description: 0..1 的章内比例（服务端存万分比）
      additionalProperties: false
    RenameChapterRequest:
      type: object
      required:
      - title
      properties:
        title:
          type: string
      additionalProperties: false
    ReplaceRule:
      type: object
      properties:
        group:
          type:
          - string
          - 'null'
          default: null
        id:
          type: integer
          format: int64
          default: 0
        isEnabled:
          type: boolean
          default: false
        isRegex:
          type: boolean
          default: false
        name:
          type: string
          default: ''
        order:
          type: integer
          format: int32
          default: 0
        pattern:
          type: string
          default: ''
        replacement:
          type: string
          default: ''
        scope:
          type:
          - string
          - 'null'
          default: null
    ReplaceRuleItem:
      type: object
      description: 替换规则条目。`name` 是身份（书名内唯一）。
      required:
      - name
      - pattern
      - replacement
      - isEnabled
      - isRegex
      - order
      properties:
        group:
          type:
          - string
          - 'null'
        isEnabled:
          type: boolean
        isRegex:
          type: boolean
        name:
          type: string
        order:
          type: integer
          format: int32
        pattern:
          type: string
          description: 匹配串；`isRegex` 为 true 时按正则解释
        replacement:
          type: string
        scope:
          type:
          - string
          - 'null'
          description: '`book:<bookId>` / `source:<bookSourceId>`；null 表示全局'
    ReplaceRulePatch:
      type: object
      description: |-
        merge-patch 请求：只写出现的字段；可空字段用「双重 Option」表达
        「缺省 = 不改 / null = 清空」（`scope` 改回全局就靠这个）。
      properties:
        group:
          type:
          - string
          - 'null'
        isEnabled:
          type:
          - boolean
          - 'null'
        isRegex:
          type:
          - boolean
          - 'null'
        order:
          type:
          - integer
          - 'null'
          format: int32
        pattern:
          type:
          - string
          - 'null'
          description: |-
            必填字段：`null` 与空串同语义（422），清空没有意义；双重 Option
            只为与同结构其他可空字段保持一致的类型形态
        replacement:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
      additionalProperties: false
    ReplaceRuleWrite:
      type: object
      required:
      - name
      - pattern
      properties:
        group:
          type:
          - string
          - 'null'
        isEnabled:
          type:
          - boolean
          - 'null'
        isRegex:
          type:
          - boolean
          - 'null'
        name:
          type: string
        order:
          type:
          - integer
          - 'null'
          format: int32
        pattern:
          type: string
        replacement:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
      additionalProperties: false
    ResetBookResult:
      type: object
      required:
      - cleared
      properties:
        cleared:
          type: integer
          format: int64
          description: 摘掉用户版本指针的章节数
          minimum: 0
    RestoreBackupRequest:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: 备份文件路径（相对用户 WebDAV 根目录）
      additionalProperties: false
    ReviewItem:
      type: object
      description: |-
        一条评论（章评或段评）。

        字段全部由书源的评论规则解析而来，缺规则就是缺字段，前端按缺省渲染。
      properties:
        author:
          type: boolean
          description: 评论者是作者本人（书源没配规则时恒为 false）。
          default: false
        authorDigg:
          type: boolean
          description: 作者赞过这条评论（书源没配规则时恒为 false）。
          default: false
        avatar:
          type: string
          default: ''
        content:
          type: string
          default: ''
        digg:
          type: integer
          format: int64
          default: 0
        id:
          type: string
          default: ''
        images:
          type: array
          items:
            type: string
          description: |-
            评论配图。同一个图站点常给出多个变体（番茄会同时给 HEIC 与 JPEG），
            顺序原样保留，由客户端挑自己能渲染的那一个。
          default: []
        name:
          type: string
          default: ''
        replies:
          type: array
          items:
            $ref: '#/components/schemas/ReviewReply'
          default: []
        replyCount:
          type: integer
          format: int64
          default: 0
        time:
          type: string
          description: |-
            原始发布时间字符串。来源站点的格式五花八门，这里不做归一化，
            前端只做展示；需要排序时用站点自己的顺序。
          default: ''
    ReviewPage:
      type: object
      description: 一页评论。
      properties:
        hasMore:
          type: boolean
          default: false
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'
          default: []
        page:
          type: integer
          format: int32
          default: 0
        total:
          type: integer
          format: int64
          description: 总条数；规则没给或取不到时为 `0`。
          default: 0
    ReviewReply:
      type: object
      description: 内联回复（评论下方直接展开的那几条）。
      properties:
        author:
          type: boolean
          description: 回复者是作者本人。
          default: false
        authorDigg:
          type: boolean
          description: 作者赞过这条回复。
          default: false
        content:
          type: string
          default: ''
        images:
          type: array
          items:
            type: string
          description: |-
            回复配图。同一张图站点常给多个格式变体，与评论配图同规则：
            顺序保留，由客户端挑能渲染的。
          default: []
        name:
          type: string
          default: ''
        replyTo:
          type: string
          description: 被回复者；为空表示直接回复评论本身。
          default: ''
        time:
          type: string
          default: ''
    ReviewResponse_ParaReviewIndex:
      type: object
      description: |-
        评论接口的响应体：把「书源支不支持」也告诉前端，
        前端据此决定要不要渲染气泡与评论入口。
      required:
      - enabled
      - serverSort
      - authorMarks
      - data
      properties:
        authorMarks:
          type: boolean
          description: |-
            书源是否配了作者标记规则（`authorRule` 等四条之一）。
            前端据此决定是否显示「只看作者」入口。
        data:
          type: object
          description: 段评概览。
          properties:
            paras:
              type: array
              items:
                $ref: '#/components/schemas/ParaReviewCount'
              default: []
        enabled:
          type: boolean
          description: 当前书源是否声明了对应的评论规则。
        serverSort:
          type: boolean
          description: |-
            书源的评论 URL 模板是否用到了 `{{sort}}`（即排序由站点自己做）。
            为 `false` 时「最新」只能对已加载的条目重排，前端据此给出提示。
    ReviewResponse_ReviewPage:
      type: object
      description: |-
        评论接口的响应体：把「书源支不支持」也告诉前端，
        前端据此决定要不要渲染气泡与评论入口。
      required:
      - enabled
      - serverSort
      - authorMarks
      - data
      properties:
        authorMarks:
          type: boolean
          description: |-
            书源是否配了作者标记规则（`authorRule` 等四条之一）。
            前端据此决定是否显示「只看作者」入口。
        data:
          type: object
          description: 一页评论。
          properties:
            hasMore:
              type: boolean
              default: false
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReviewItem'
              default: []
            page:
              type: integer
              format: int32
              default: 0
            total:
              type: integer
              format: int64
              description: 总条数；规则没给或取不到时为 `0`。
              default: 0
        enabled:
          type: boolean
          description: 当前书源是否声明了对应的评论规则。
        serverSort:
          type: boolean
          description: |-
            书源的评论 URL 模板是否用到了 `{{sort}}`（即排序由站点自己做）。
            为 `false` 时「最新」只能对已加载的条目重排，前端据此给出提示。
    ReviewRule:
      type: object
      description: |-
        章评（章节评论）规则。

        阅读3.0 里 `ruleReview` 是「预留字段」，官方实现从不执行（见
        `docs/reference/book-source-rules.md` 第 17 节），因此这里把它接上：
        `reviewUrl` 按**章节正文响应**求值，得到该章的评论列表地址，
        其余字段描述如何从响应里取出一条评论。

        前四个字段沿用阅读3.0 的既有命名，后面的是本项目为「能真正渲染评论」
        补的解析字段。
      properties:
        authorDiggRule:
          type:
          - string
          - 'null'
          description: 作者赞过这条评论。
          default: null
        authorRule:
          type:
          - string
          - 'null'
          description: 评论者是作者本人（真值词表见规格 §15）。
          default: null
        avatarRule:
          type:
          - string
          - 'null'
          default: null
        contentRule:
          type:
          - string
          - 'null'
          default: null
        deleteUrl:
          type:
          - string
          - 'null'
          default: null
        diggRule:
          type:
          - string
          - 'null'
          description: 点赞数。
          default: null
        hasMoreRule:
          type:
          - string
          - 'null'
          description: 是否还有下一页。
          default: null
        idRule:
          type:
          - string
          - 'null'
          description: 评论 ID，用于前端去重与「加载更多」拼接。
          default: null
        imageRule:
          type:
          - string
          - 'null'
          description: 评论配图。写成列表规则（如 `$.image_url[*]`）时取多个；JS 规则按行切分。
          default: null
        listRule:
          type:
          - string
          - 'null'
          description: 评论列表项的选择规则（JSONPath / CSS / XPath / 正则）。
          default: null
        nameRule:
          type:
          - string
          - 'null'
          description: 用户名。
          default: null
        postQuoteUrl:
          type:
          - string
          - 'null'
          default: null
        postReviewUrl:
          type:
          - string
          - 'null'
          default: null
        postTimeRule:
          type:
          - string
          - 'null'
          default: null
        replyAuthorDiggRule:
          type:
          - string
          - 'null'
          description: 作者赞过这条回复。
          default: null
        replyAuthorRule:
          type:
          - string
          - 'null'
          description: 回复者是作者本人。
          default: null
        replyContentRule:
          type:
          - string
          - 'null'
          default: null
        replyCountRule:
          type:
          - string
          - 'null'
          description: 回复数。
          default: null
        replyImageRule:
          type:
          - string
          - 'null'
          description: 回复配图（楼中楼里的图片）。缺省时回落到 [`ReviewRule::image_rule`]。
          default: null
        replyListRule:
          type:
          - string
          - 'null'
          description: 内联回复列表（`reply_list` 之类）的选择规则。
          default: null
        replyNameRule:
          type:
          - string
          - 'null'
          default: null
        replyPostTimeRule:
          type:
          - string
          - 'null'
          default: null
        replyToRule:
          type:
          - string
          - 'null'
          description: 回复的目标用户名（「回复 @某人」）。
          default: null
        reviewQuoteUrl:
          type:
          - string
          - 'null'
          default: null
        reviewUrl:
          type:
          - string
          - 'null'
          description: 章评列表 URL 模板，对章节正文响应求值。
          default: null
        totalRule:
          type:
          - string
          - 'null'
          description: 评论总数，用于「本章评论 · N」。
          default: null
        voteDownUrl:
          type:
          - string
          - 'null'
          default: null
        voteUpUrl:
          type:
          - string
          - 'null'
          default: null
    SearchBook:
      type: object

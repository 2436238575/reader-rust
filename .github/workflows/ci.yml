name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 定期跑（配合下方 e2e job 的定时全量回归）
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # 集成测试里的 agent_sidecar_flow 用 Node 起假 sidecar，ubuntu 镜像自带 Node
      - name: test
        run: cargo test

      # ts-rs 生成的前端类型在 cargo test 时刷新；未提交即模型漂移
      - name: ts-rs bindings are committed
        run: git diff --exit-code frontend/src/types/generated/

      # 依赖安全审计（硬门禁）。Cargo.lock 里残留的 rsa 0.9.10
      # （RUSTSEC-2023-0071）在依赖树中不可达（cargo tree -i rsa 无结果），
      # 由 .cargo/audit.toml 精确忽略该单条；除此之外的任何漏洞直接失败
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 开发主平台是 Windows：lib 单元测试在 windows 上跑，防止 unix-only 假设
  # 混进核心逻辑；集成测试仍由 ubuntu job 覆盖
  rust-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: test (lib only)
        run: cargo test --lib

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # build 内含 vue-tsc -b，类型错误直接失败
      - name: Build (type check)
        working-directory: frontend
        run: npm run build

      - name: Unit test
        working-directory: frontend
        run: npm test

      # 生产依赖漏洞闸门：只看运行时依赖（--omit=dev），high 及以上才失败
      - name: npm audit (prod deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # sidecar（Python）：pytest、ruff、mypy 均为硬门禁；mypy 存量类型错误
  # 已清零，类型检查失败直接阻断合并
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # --frozen：CI 不允许改写 uv.lock，锁文件与 pyproject 漂移直接失败
      - name: Sync deps
        working-directory: sidecar
        run: uv sync --extra dev --frozen

      - name: Test (pytest)
        working-directory: sidecar
        run: uv run pytest -q

      - name: Lint (ruff)
        working-directory: sidecar
        run: uv run ruff check agent_sidecar tests

      - name: Type check (mypy)
        working-directory: sidecar
        run: uv run mypy agent_sidecar

  # e2e 全量回归成本高（构建后端 + 装 Chrome + 起临时实例），只在手动触发
  # 与每周定时跑；globalSetup 会自动用 target/debug 的构建产物起临时后端
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build backend
        run: cargo build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install

      - name: Install Chrome
        run: npx playwright install chrome

      - name: e2e
        run: npm run test:e2e

[package]
name = "reader-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "blocking", "cookies"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
config = "0.14"
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
argon2 = "0.5"
jsonwebtoken = "9"
aes = "0.8"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
md-5 = "0.10"
hex = "0.4"
scraper = "0.20"
jsonpath_lib = "0.3"
regex = "1"
rquickjs = { version = "0.7", features = ["futures"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id", "fs", "set-header", "compression-gzip"] }
http = "1"
urlencoding = "2"
futures = "0.3"
rand = "0.8"
once_cell = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
sxd-xpath = "0.4"
sxd-document = "0.3"
quick-xml = "0.41"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
heic-rs = { version = "0.1", default-features = false, features = ["std"] }
jpeg-encoder = "0.7"

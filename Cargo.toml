[package]
name = "reader-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GET+POST 参数合并提取器（api/extract.rs）的终态解析：标量强转 + 重复键数组。
# 0.3 起空值语义反转（`?a=` 从 None 变 Some("")），extract.rs 在编码前统一
# 丢弃空值以维持「空串即缺省」的旧契约
serde_html_form = "0.4"
# sqlx 0.9 删除了 runtime+TLS 组合特性；SQLite 不需要 TLS
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "blocking", "cookies", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
config = "0.15"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
argon2 = "0.6"
# v10 起加密后端需显式二选一；rust_crypto 是纯 Rust 实现（RustCrypto 家族），
# 避免 aws-lc-rs 引入 C 构建链
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
aes = "0.9"
bytes = "1"
cbc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
md-5 = "0.11"
# Refresh Token 只以 SHA-256 摘要落库，明文永不持久化
sha2 = "0.11"
hex = "0.4"
# 正文池压缩：历史严格保留，压缩能明显减慢数据库增长
# 下限 0.14.3：修复 RUSTSEC-2026-0391（复用流上下文串数据），同时把 zstd-safe
# 抬到 8.2.0 修复 RUSTSEC-2026-0398 / RUSTSEC-2026-0403
zstd = "0.14.3"
scraper = "0.29"
# RFC 9535 完整实现（维护活跃）；旧的 jsonpath_lib 0.3 多年未维护且解析器可 panic。
# 方言差异：不支持 `=~` 正则过滤，改用 match()/search() 函数（见 docs/reference/book-source-rules.md §9.1）
jsonpath-rfc9535 = "0.1.2"
regex = "1"
rquickjs = { version = "0.14", features = ["futures", "classes", "properties"] }
# 入站防护（api/inbound_guard.rs）：并发上限用 tower::limit。
# util 的 ServiceExt::oneshot 只在测试里驱动测试路由，放 dev-dependencies。
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "fs", "set-header", "compression-gzip"] }
http = "1"
urlencoding = "2"
futures = "0.3"
rand = "0.10"
once_cell = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
url = "2"
sxd-xpath = "0.4"
sxd-document = "0.3"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
heic-rs = { version = "0.1", default-features = false, features = ["std"] }
jpeg-encoder = "0.7"
# 图片按宽度缩放（load_variant）：只开 jpeg/png/bmp 解码，GIF/AVIF 一律原样透传
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
# Accept 协商的有损 webp 编码（libwebp 绑定）；image 的 webp 只有无损，不能冒充省流
webp = "0.3"
# WebDAV 协议实现（PROPFIND/PUT/LOCK 等），litmus 验证过的成熟实现；
# Basic 认证与 Windows 路径加固仍在 axum 层（src/api/handlers/webdav.rs）。
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
# 直通 dav-server 的请求体不走 axum 提取器，DefaultBodyLimit 对其无效，
# 用 Limited 显式保持 WebDAV PUT 的体积上限。
http-body-util = "0.1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
imara-diff = "0.2"

[dev-dependencies]
# 测试里用 ServiceExt::oneshot 驱动 Router（src/api/inbound_guard.rs 内联测试）；
# cargo 会在测试构建时把它与主依赖的 limit 特性合并
tower = { version = "0.5", features = ["util"] }
